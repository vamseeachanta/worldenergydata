name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.{1,80}$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the required pattern. The subject must be 80 characters or less.

  file-size:
    name: Check File Sizes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          MAX_SIZE=5000000  # 5MB in bytes
          LARGE_FILES=""

          for file in $(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1); do
            if [ -f "$file" ]; then
              SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
              if [ "$SIZE" -gt "$MAX_SIZE" ]; then
                LARGE_FILES="$LARGE_FILES\n- $file ($(numfmt --to=iec $SIZE))"
              fi
            fi
          done

          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large files detected (>5MB):$LARGE_FILES"
          fi

  sensitive-files:
    name: Check Sensitive Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Parent access: actions/checkout README, "Checkout HEAD^" (2026).
          # https://github.com/actions/checkout#checkout-head
          fetch-depth: 2

      - name: Check for sensitive files
        shell: bash
        run: python3 scripts/ci/check_sensitive_files.py

  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    # NOTE: This job must ALWAYS run. "Changelog Check" is a required status check
    # in the main branch ruleset, and a required check that is skipped (via a
    # job-level `if:`) is never "satisfied" — it deadlocks the PR at BLOCKED
    # forever. That previously made every chore/ci/dependabot PR unmergeable
    # (#802). The step below is advisory only (it emits a notice, never fails),
    # so running it unconditionally is safe and satisfies the required context.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changelog update
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE "^CHANGELOG|^HISTORY|^NEWS"; then
            echo "Changelog has been updated"
          else
            echo "::notice::Consider updating the changelog for this PR"
          fi

  code-owners:
    name: Code Owners Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check CODEOWNERS exists
        run: |
          if [ -f ".github/CODEOWNERS" ] || [ -f "CODEOWNERS" ] || [ -f "docs/CODEOWNERS" ]; then
            echo "CODEOWNERS file found"
          else
            echo "::notice::Consider adding a CODEOWNERS file"
          fi

  pack-lint:
    name: Lint Changed Knowledge Packs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Lint changed agent packs
        env:
          PACK_ACCOUNT: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # pull_request checkout is the merge ref; its first parent is the current base.
          # Reject a non-merge checkout rather than silently checking only one commit.
          git rev-parse --verify HEAD^2 > /dev/null
          BASE_SHA=$(git rev-parse --verify HEAD^1)
          changed_packs_file=$(mktemp)
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- ':(glob)**/agent-pack.md' > "$changed_packs_file"
          mapfile -d '' -t packs < "$changed_packs_file"
          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed agent packs."
            exit 0
          fi
          python scripts/pack_lint.py --account "$PACK_ACCOUNT" "${packs[@]}"
