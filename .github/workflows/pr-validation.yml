name: PR Validation

# PR fast gate (28 Oct 2026): only quick checks run here. Check Sensitive Files
# is required; the title, file-size and knowledge-pack lints are advisory or
# path-scoped. The advisory-only Changelog and Code Owners notices were removed
# with their required-check status.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","x64"]') }}

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.{1,80}$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the required pattern. The subject must be 80 characters or less.

  file-size:
    name: Check File Sizes
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","x64"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          MAX_SIZE=5000000  # 5MB in bytes
          LARGE_FILES=""

          for file in $(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1); do
            if [ -f "$file" ]; then
              SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
              if [ "$SIZE" -gt "$MAX_SIZE" ]; then
                LARGE_FILES="$LARGE_FILES\n- $file ($(numfmt --to=iec $SIZE))"
              fi
            fi
          done

          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large files detected (>5MB):$LARGE_FILES"
          fi

  sensitive-files:
    name: Check Sensitive Files
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","x64"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Parent access: actions/checkout README, "Checkout HEAD^" (2026).
          # https://github.com/actions/checkout#checkout-head
          fetch-depth: 2

      - name: Check for sensitive files
        shell: bash
        run: |
          set -euo pipefail
          # pull_request uses the merge ref; ^1 is its base and ^2 its PR head.
          # Git gitrevisions manual, "Specifying Revisions" (2026):
          # https://git-scm.com/docs/gitrevisions
          if ! git rev-parse --verify HEAD^2 > /dev/null; then
            echo "::error::Expected the pull_request merge ref with both parents."
            exit 1
          fi
          BASE_SHA=$(git rev-parse --verify HEAD^1)
          changed_files=$(mktemp)
          # Git git-diff manual (2026): -z preserves filenames; lowercase d
          # excludes deletions; --no-renames exposes every destination as added.
          # https://git-scm.com/docs/git-diff
          if ! git diff --name-only --no-renames --diff-filter=d -z "$BASE_SHA" HEAD -- > "$changed_files"; then
            echo "::error::Unable to compute PR filename diff."
            exit 1
          fi

          # Existing filename policy, expressed as POSIX extended regexes.
          # Include dotted .env variants; keep secret/credential substring checks.
          # Bash manual, "Conditional Constructs" (2026), documents =~:
          # https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html
          SENSITIVE_PATTERNS=(
            '(^|/)\.env($|\.)'
            '\.(pem|key|p12)$'
            'secret|credential'
            '(^|/)(id_rsa|id_dsa)$'
          )
          found=false
          while IFS= read -r -d '' file; do
            for pattern in "${SENSITIVE_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                # Shell escaping keeps embedded newlines out of annotations.
                printf '::error::Potentially sensitive filename: %q\n' "$file"
                found=true
                break
              fi
            done
          done < "$changed_files"

          if [ "$found" = true ]; then
            exit 1
          fi
          echo "No potentially sensitive filenames in PR changes."

  pack-lint:
    name: Lint Changed Knowledge Packs
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","x64"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Lint changed agent packs
        env:
          PACK_ACCOUNT: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # pull_request checkout is the merge ref; its first parent is the current base.
          # Reject a non-merge checkout rather than silently checking only one commit.
          git rev-parse --verify HEAD^2 > /dev/null
          BASE_SHA=$(git rev-parse --verify HEAD^1)
          changed_packs_file=$(mktemp)
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- ':(glob)**/agent-pack.md' > "$changed_packs_file"
          mapfile -d '' -t packs < "$changed_packs_file"
          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed agent packs."
            exit 0
          fi
          python scripts/pack_lint.py --account "$PACK_ACCOUNT" "${packs[@]}"
