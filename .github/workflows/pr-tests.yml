name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-tests:
    name: Quick PR Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
          .venv
        key: pr-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
    
    - name: Install dependencies
      run: |
        pip install uv
        uv venv
        uv pip install -e ".[dev]"
    
    - name: Run quick smoke tests
      id: smoke-tests
      run: |
        # Run only fast tests for quick feedback
        uv run pytest tests/ -m "not slow" -x --tb=short --timeout=60 -q
    
    - name: Check code quality
      run: |
        echo "## Code Quality Checks" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Black formatting
        echo "### Black Formatting" >> $GITHUB_STEP_SUMMARY
        if uv run black --check src tests; then
          echo "✅ Code formatting is correct" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Code needs formatting (run: black src tests)" >> $GITHUB_STEP_SUMMARY
          echo "Files that need formatting:" >> $GITHUB_STEP_SUMMARY
          uv run black --diff src tests >> $GITHUB_STEP_SUMMARY 2>&1 || true
        fi
        
        # isort
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Import Sorting" >> $GITHUB_STEP_SUMMARY
        if uv run isort --check-only src tests; then
          echo "✅ Imports are correctly sorted" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Imports need sorting (run: isort src tests)" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Ruff linting
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Ruff Linting" >> $GITHUB_STEP_SUMMARY
        if uv run ruff check src tests; then
          echo "✅ No linting issues found" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Linting issues detected" >> $GITHUB_STEP_SUMMARY
          uv run ruff check src tests --format github >> $GITHUB_STEP_SUMMARY 2>&1 || true
        fi
    
    - name: Check for large files
      run: |
        # Check for files larger than 1MB
        large_files=$(find . -type f -size +1M -not -path "./.git/*" -not -path "./venv/*" -not -path "./.venv/*")
        if [ -n "$large_files" ]; then
          echo "⚠️ Large files detected (>1MB):" >> $GITHUB_STEP_SUMMARY
          echo "$large_files" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Security scan
      run: |
        pip install bandit safety
        
        echo "## Security Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Bandit security scan
        echo "### Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
        if bandit -r src -f json -o bandit_report.json 2>/dev/null; then
          echo "✅ No security issues found" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Potential security issues detected" >> $GITHUB_STEP_SUMMARY
          python -c "
        import json
        with open('bandit_report.json') as f:
            data = json.load(f)
            for result in data.get('results', [])[:5]:  # Show first 5 issues
                print(f\"- {result['issue_text']} in {result['filename']}:{result['line_number']}\")
        " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
        fi
        
        # Safety check for known vulnerabilities
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
        if safety check --json > safety_report.json 2>/dev/null; then
          echo "✅ No known vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Potential vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

  performance-check:
    name: Performance Impact Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout base branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
    
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run performance comparison
      run: |
        pip install uv pytest-benchmark
        
        # Run benchmarks on base branch
        cd base
        uv venv
        uv pip install -e ".[dev]"
        uv run pytest tests/ -m benchmark --benchmark-only --benchmark-json=../base_benchmark.json -q || true
        
        # Run benchmarks on PR branch
        cd ../pr
        uv venv
        uv pip install -e ".[dev]"
        uv run pytest tests/ -m benchmark --benchmark-only --benchmark-json=../pr_benchmark.json -q || true
        
        cd ..
        
        # Compare results
        if [ -f base_benchmark.json ] && [ -f pr_benchmark.json ]; then
          echo "## Performance Impact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python -c "
        import json
        
        with open('base_benchmark.json') as f:
            base = json.load(f)
        with open('pr_benchmark.json') as f:
            pr = json.load(f)
        
        base_benchmarks = {b['name']: b['stats']['mean'] for b in base.get('benchmarks', [])}
        pr_benchmarks = {b['name']: b['stats']['mean'] for b in pr.get('benchmarks', [])}
        
        print('| Test | Base (s) | PR (s) | Change |')
        print('|------|----------|--------|--------|')
        
        for name in pr_benchmarks:
            if name in base_benchmarks:
                base_time = base_benchmarks[name]
                pr_time = pr_benchmarks[name]
                change = ((pr_time - base_time) / base_time) * 100
                emoji = '🔴' if change > 10 else '🟡' if change > 5 else '🟢'
                print(f'| {name[:30]} | {base_time:.4f} | {pr_time:.4f} | {emoji} {change:+.1f}% |')
        " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Unable to compare benchmarks" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

  pr-comment:
    name: PR Test Summary
    runs-on: ubuntu-latest
    needs: [quick-tests, performance-check]
    if: always()
    
    permissions:
      pull-requests: write
    
    steps:
    - name: Create PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const quickTestsResult = '${{ needs.quick-tests.result }}';
          const perfCheckResult = '${{ needs.performance-check.result }}';
          
          let statusEmoji = '✅';
          let statusText = 'All checks passed';
          
          if (quickTestsResult === 'failure' || perfCheckResult === 'failure') {
            statusEmoji = '❌';
            statusText = 'Some checks failed';
          } else if (quickTestsResult === 'skipped' || perfCheckResult === 'skipped') {
            statusEmoji = '⚠️';
            statusText = 'Some checks were skipped';
          }
          
          const body = `## ${statusEmoji} PR Test Results
          
          **Status:** ${statusText}
          
          | Check | Result |
          |-------|--------|
          | Quick Tests | ${quickTestsResult === 'success' ? '✅ Passed' : quickTestsResult === 'failure' ? '❌ Failed' : '⏭️ Skipped'} |
          | Performance Check | ${perfCheckResult === 'success' ? '✅ Passed' : perfCheckResult === 'failure' ? '❌ Failed' : '⏭️ Skipped'} |
          
          ---
          
          <details>
          <summary>🔍 View Details</summary>
          
          - [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Test Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
          
          </details>
          
          *Updated at ${new Date().toUTCString()}*
          `;
          
          // Find and update or create comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('PR Test Results')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }