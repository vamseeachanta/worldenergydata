name: Build API Docs

# Docs build is part of the daily "Main full run" (28 Oct 2026 fast gate); it no
# longer runs on pull requests or pushes. Dispatch this workflow to build ad hoc.
on:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","x64"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build docs
        run: uv run --group docs mkdocs build --strict
