      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: |
          uv run mypy src/worldenergydata/ \
            --ignore-missing-imports \
            --no-error-summary \
            --show-error-codes
        continue-on-error: true

  security:
