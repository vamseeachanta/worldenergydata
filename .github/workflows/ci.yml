name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 9 * * *" # nightly full matrix (~04:17 CT)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  # ---------------------------------------------------------------- PR gate --
  # Module-scoped fast gate (#474, #496): a PR tests only the modules its changed
  # paths touch (+ the always-on cross-cutting core), on one Python, xdist, no
  # coverage. Targets come from scripts/ci/select_test_targets.py — the single
  # source of truth (a module is mapped iff tests/unit/<module>/ exists; new
  # modules auto-map, guarded by tests/ci/test_select_test_targets.py). The full
  # 3-Python matrix runs on push to main, nightly, dispatch, or `ci-full` PRs.

  test-pr:
    name: Test (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need the base commit to diff changed files

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Select test targets
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Single source of truth: scripts/ci/select_test_targets.py maps the
          # changed files to pytest targets (auto-discovers modules from the
          # filesystem; core paths -> full tree; docs/reports-only -> just the
          # always-on cross-cutting set). Stdlib only — no uv sync needed.
          git diff --name-only "$BASE_SHA"...HEAD > changed-files.txt
          echo "Changed files:"; cat changed-files.txt
          python3 scripts/ci/select_test_targets.py --files-from changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Run module-scoped tests (xdist)
        run: |
          echo "Scope: ${{ steps.targets.outputs.scope }}"
          echo "xdist: ${{ steps.targets.outputs.xdist_targets }}"
          uv run --with pytest-xdist pytest ${{ steps.targets.outputs.xdist_targets }} \
            -n auto \
            --tb=short \
            --junitxml=test-results.xml

      - name: Run sequential tests (integration / performance)
        if: steps.targets.outputs.seq_targets != ''
        run: |
          echo "seq: ${{ steps.targets.outputs.seq_targets }}"
          uv run pytest ${{ steps.targets.outputs.seq_targets }} \
            --tb=short \
            --junitxml=test-results-seq.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-pr-gate
          path: |
            test-results.xml
            test-results-seq.xml

  # ------------------------------------------------------------ full matrix --
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          # tests/integration kills xdist workers (a CLI edge-case test
          # hard-exits the process); tests/performance asserts wall-clock
          # budgets — both run sequentially below. Targets are enumerated
          # explicitly: tests/pytest.ini sets rootdir to tests/, which breaks
          # cwd-relative --ignore matching during recursion.
          targets=$(find tests -maxdepth 1 -mindepth 1 \( -type d ! -name performance ! -name integration ! -name __pycache__ \) -o -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
          uv run --with pytest-xdist pytest $targets \
            -n auto \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Run sequential tests (integration / performance)
        run: |
          uv run pytest tests/integration tests/performance \
            --tb=short \
            --cov=src \
            --cov-append \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Black
        run: uv run black --check --diff src/ tests/

      - name: Run isort
        run: uv run isort --check-only --diff src/ tests/

      - name: Run flake8
        run: |
          uv run flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.egg-info,.git,.venv

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: |
          uv run mypy src/worldenergydata/ \
            --ignore-missing-imports \
            --no-error-summary \
            --show-error-codes
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run bandit security scan
        run: |
          uv pip install bandit
          uv run bandit -r src/ -ll -ii -x tests/ || true

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint] # test job skips on unlabeled PRs (module gate covers them)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build documentation
        run: |
          if [ -f docs/conf.py ]; then
            cd docs && uv run sphinx-build -b html . _build/html
          else
            echo "Skipping Sphinx build: docs/conf.py is not present"
          fi
