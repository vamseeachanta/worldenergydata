      - name: Build package
        # Workspace mode (ADR 0001 Phase 2 PR #1): build BOTH the root
        # worldenergydata wheel and the worldenergydata-core member wheel so the
        # build job exercises the full workspace, not just the root package.
        run: uv build --all-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  docs:
