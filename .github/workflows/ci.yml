name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Metadata edits copy the last full result; base changes run the full gate.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: "17 9 * * *" # nightly full matrix (~04:17 CT)
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    (github.event.action != 'edited' || github.event.changes.base != null) && github.ref || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
    (github.event.action != 'edited' || github.event.changes.base != null) }}

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  mode:
    name: Gate mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      replay: ${{ steps.mode.outputs.replay }}
    steps:
      - name: Select gate mode
        id: mode
        env:
          REPLAY: >-
            ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BASE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          echo "replay=$REPLAY"
          if [ "$IS_PR" = true ] && [ "$REPLAY" != true ]; then
            tip=$(git ls-remote --exit-code "$BASE_URL" "refs/heads/$BASE_REF" | cut -f1)
            if [[ ! "$tip" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Cannot record a unique base tip"
              exit 1
            fi
            printf . > "$RUNNER_TEMP/gate-tip"
            echo "tip=$tip" >> "$GITHUB_OUTPUT"
          fi
      - name: Record full-run base tip
        if: github.event_name == 'pull_request' && steps.mode.outputs.replay != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gate-tip-${{ steps.mode.outputs.tip }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-tip
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------- PR domain gate --
  # Modular per-domain PR gate (#474, #496, domain-matrix): a PR fans out into
  # one CI job per touched domain (+ the always-on cross-cutting core), so each
  # domain passes/fails in isolation (a red domain no longer blocks green
  # siblings) and they run in parallel. Targets come from
  # scripts/ci/select_test_targets.py --emit-matrix — the single source of truth
  # (a module is mapped iff tests/unit/<module>/ exists; new modules auto-map,
  # guarded by tests/ci/test_select_test_targets.py). On core-path changes the
  # matrix fans out to EVERY domain. The aggregate `pr-gate` job is the single
  # required status check. The full 3-Python matrix still runs on push to main,
  # nightly, dispatch, or `ci-full` PRs.

  # The discover -> test-domain (matrix) -> aggregate scaffolding now lives in
  # the shared reusable workflow (workspace-hub#.../domain-matrix.yml, P4
  # worldenergydata#530). wed's conventions match the reusable defaults exactly
  # (selector scripts/ci/select_test_targets.py, uv sync --all-extras, quarantine
  # scripts/ci/quarantine.txt, python-setup uv, max-parallel 10), so the caller
  # passes no `with:` overrides.
  domain-tests:
    needs: [mode]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (!cancelled() && (needs.mode.result != 'success' || needs.mode.outputs.replay != 'true') && github.event_name
      == 'pull_request')
    uses: vamseeachanta/workspace-hub/.github/workflows/domain-matrix.yml@main

  # ------------------------------------------------------------ full matrix --
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [mode]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (!cancelled() && (needs.mode.result != 'success' || needs.mode.outputs.replay != 'true') && (
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci-full'))))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Build local pull request merge
        id: local_merge
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_ref="refs/remotes/base/$BASE_REF"
          git fetch --no-tags "$BASE_URL" "+refs/heads/$BASE_REF:$base_ref"
          tip=$(git rev-parse "$base_ref")
          for deepen in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$deepen" "$HEAD_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$deepen" "$BASE_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_URL" "$PR_HEAD_SHA"
              git fetch --no-tags "$BASE_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
            echo "::error::No merge base for current base tip and pull request head"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge pull request head into current base tip"
            git merge --abort
            exit 1
          fi
          mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          first_parent=${parents[0]:-}
          second_parent=${parents[1]:-}
          if [ "${#parents[@]}" -ne 2 ] || [ "$first_parent" != "$tip" ] || \
             [ "$second_parent" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge does not have exactly the expected two parents"
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tested=$tested first_parent=$first_parent second_parent=$second_parent" \
            "tip=$tip event_base=$EVENT_BASE tree=$tree"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          # tests/integration kills xdist workers (a CLI edge-case test
          # hard-exits the process); tests/performance asserts wall-clock
          # budgets — both run sequentially below. Targets are enumerated
          # explicitly so the two heavy lanes stay out of the parallel run.
          # rootdir is now deterministically the repo root (single pyproject.toml
          # config, #529), so node ids are stably tests/-prefixed.
          targets=$(find tests -maxdepth 1 -mindepth 1 \( -type d ! -name performance ! -name integration ! -name __pycache__ \) -o -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
          uv run --with pytest-xdist pytest $targets \
            -n auto \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=reports/coverage/test-results.xml

      - name: Run sequential tests (integration / performance)
        run: |
          uv run pytest tests/integration tests/performance \
            --tb=short \
            --cov=src \
            --cov-append \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            reports/coverage/test-results.xml
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint (full)
    runs-on: ubuntu-latest
    needs: [mode]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (!cancelled() && (needs.mode.result != 'success' || needs.mode.outputs.replay != 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Build local pull request merge
        id: local_merge
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_ref="refs/remotes/base/$BASE_REF"
          git fetch --no-tags "$BASE_URL" "+refs/heads/$BASE_REF:$base_ref"
          tip=$(git rev-parse "$base_ref")
          for deepen in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$deepen" "$HEAD_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$deepen" "$BASE_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_URL" "$PR_HEAD_SHA"
              git fetch --no-tags "$BASE_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" > /dev/null; then
            echo "::error::No merge base for current base tip and pull request head"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge pull request head into current base tip"
            git merge --abort
            exit 1
          fi
          mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          first_parent=${parents[0]:-}
          second_parent=${parents[1]:-}
          if [ "${#parents[@]}" -ne 2 ] || [ "$first_parent" != "$tip" ] || \
             [ "$second_parent" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge does not have exactly the expected two parents"
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tested=$tested first_parent=$first_parent second_parent=$second_parent" \
            "tip=$tip event_base=$EVENT_BASE tree=$tree"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Black
        run: uv run black --check --diff src/ tests/

      - name: Run isort
        run: uv run isort --check-only --diff src/ tests/

      - name: Run flake8
        run: |
          uv run flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.egg-info,.git,.venv

  type-check:
    name: Type Check (full)
    runs-on: ubuntu-latest
    needs: [mode]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
