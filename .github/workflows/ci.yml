name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 9 * * *" # nightly full matrix (~04:17 CT)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  # ---------------------------------------------------------------- PR gate --
  # Module-scoped fast gate (#474): PRs test only the modules their changed
  # paths touch (plus the always-on cross-cutting core), on one Python, with
  # xdist and no coverage. The full 3-Python matrix runs on push to main,
  # nightly, manual dispatch, or PRs labeled `ci-full`.
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      core: ${{ steps.filter.outputs.core }}
      matched: ${{ steps.filter.outputs.changes }}
      unclassified: ${{ steps.filter.outputs.unclassified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Classify changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'src/worldenergydata/engine.py'
              - 'src/worldenergydata/__main__.py'
              - 'src/worldenergydata/base_configs/**'
              - 'src/worldenergydata/common/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - 'tests/pytest.ini'
              - '.github/workflows/ci.yml'
            bsee:
              - 'src/worldenergydata/bsee/**'
              - 'tests/unit/bsee/**'
              - 'tests/integration/modules/bsee/**'
            fdas:
              - 'src/worldenergydata/fdas/**'
              - 'tests/unit/fdas/**'
            sodir:
              - 'src/worldenergydata/sodir/**'
              - 'tests/unit/sodir/**'
            texas_rrc:
              - 'src/worldenergydata/texas_rrc/**'
              - 'tests/unit/texas_rrc/**'
            canada:
              - 'src/worldenergydata/canada/**'
              - 'tests/unit/canada/**'
            mexico_cnh:
              - 'src/worldenergydata/mexico_cnh/**'
              - 'tests/unit/mexico_cnh/**'
            landman:
              - 'src/worldenergydata/landman/**'
              - 'tests/unit/landman/**'
            marine_safety:
              - 'src/worldenergydata/marine_safety/**'
              - 'tests/unit/marine_safety/**'
            pipeline_safety:
              - 'src/worldenergydata/pipeline_safety/**'
              - 'tests/unit/pipeline_safety/**'
            production:
              - 'src/worldenergydata/production/**'
              - 'tests/unit/production/**'
            cli:
              - 'src/worldenergydata/cli/**'
              - 'tests/unit/cli/**'
            workflows:
              - 'docs/registry/**'
              - 'examples/workflows/**'
              - 'tests/workflows/**'
            docs_only:
              - '**/*.md'
              - 'docs/**'
            unclassified:
              - '!src/worldenergydata/engine.py'
              - '!src/worldenergydata/__main__.py'
              - '!src/worldenergydata/base_configs/**'
              - '!src/worldenergydata/common/**'
              - '!pyproject.toml'
              - '!uv.lock'
              - '!tests/conftest.py'
              - '!tests/pytest.ini'
              - '!.github/workflows/ci.yml'
              - '!src/worldenergydata/bsee/**'
              - '!tests/unit/bsee/**'
              - '!tests/integration/modules/bsee/**'
              - '!src/worldenergydata/fdas/**'
              - '!tests/unit/fdas/**'
              - '!src/worldenergydata/sodir/**'
              - '!tests/unit/sodir/**'
              - '!src/worldenergydata/texas_rrc/**'
              - '!tests/unit/texas_rrc/**'
              - '!src/worldenergydata/canada/**'
              - '!tests/unit/canada/**'
              - '!src/worldenergydata/mexico_cnh/**'
              - '!tests/unit/mexico_cnh/**'
              - '!src/worldenergydata/landman/**'
              - '!tests/unit/landman/**'
              - '!src/worldenergydata/marine_safety/**'
              - '!tests/unit/marine_safety/**'
              - '!src/worldenergydata/pipeline_safety/**'
              - '!tests/unit/pipeline_safety/**'
              - '!src/worldenergydata/production/**'
              - '!tests/unit/production/**'
              - '!src/worldenergydata/cli/**'
              - '!tests/unit/cli/**'
              - '!docs/registry/**'
              - '!examples/workflows/**'
              - '!tests/workflows/**'
              - '!**/*.md'
              - '!docs/**'

  test-pr:
    name: Test (PR gate)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Select test targets
        id: targets
        env:
          CORE: ${{ needs.changes.outputs.core }}
          MATCHED: ${{ needs.changes.outputs.matched }}
          UNCLASSIFIED: ${{ needs.changes.outputs.unclassified }}
        run: |
          # Always-on cross-cutting set: engine contract, assetutilities
          # contracts, and the durable-workflow registry.
          # Two execution buckets:
          #   xdist — unit-style dirs, parallel-safe
          #   seq   — tests/integration/** (a CLI edge-case test hard-exits
          #           the process and kills xdist workers) and
          #           tests/performance (wall-clock assertions)
          xdist="tests/unit/core tests/unit/common tests/contracts tests/workflows"
          seq=""
          declare -A module_xdist=(
            [bsee]="tests/unit/bsee"
            [fdas]="tests/unit/fdas"
            [sodir]="tests/unit/sodir"
            [texas_rrc]="tests/unit/texas_rrc"
            [canada]="tests/unit/canada"
            [mexico_cnh]="tests/unit/mexico_cnh"
            [landman]="tests/unit/landman"
            [marine_safety]="tests/unit/marine_safety"
            [pipeline_safety]="tests/unit/pipeline_safety"
            [production]="tests/unit/production"
            [cli]="tests/unit/cli"
          )
          declare -A module_seq=(
            [bsee]="tests/integration/modules/bsee"
          )
          if [ "$CORE" = "true" ] || echo "$UNCLASSIFIED" | grep -q true; then
            # Core or unmapped paths changed: fail safe, run the whole tree.
            # Enumerate explicit targets rather than recursing tests/ with
            # --ignore: tests/pytest.ini makes pytest's rootdir tests/, which
            # breaks cwd-relative --ignore matching.
            full=$(find tests -maxdepth 1 -mindepth 1 \( -type d ! -name performance ! -name integration ! -name __pycache__ \) -o -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "xdist_targets=$full" >> "$GITHUB_OUTPUT"
            echo "seq_targets=tests/integration tests/performance" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for mod in "${!module_xdist[@]}"; do
            if echo "$MATCHED" | grep -q "\"$mod\""; then
              for d in ${module_xdist[$mod]}; do
                [ -d "$d" ] && xdist="$xdist $d"
              done
              for d in ${module_seq[$mod]:-}; do
                [ -d "$d" ] && seq="$seq $d"
              done
            fi
          done
          echo "scope=modules" >> "$GITHUB_OUTPUT"
          echo "xdist_targets=$xdist" >> "$GITHUB_OUTPUT"
          echo "seq_targets=$seq" >> "$GITHUB_OUTPUT"

      - name: Run module-scoped tests (xdist)
        run: |
          echo "Scope: ${{ steps.targets.outputs.scope }}"
          echo "xdist: ${{ steps.targets.outputs.xdist_targets }}"
          uv run --with pytest-xdist pytest ${{ steps.targets.outputs.xdist_targets }} \
            -n auto \
            --tb=short \
            --junitxml=test-results.xml

      - name: Run sequential tests (integration / performance)
        if: steps.targets.outputs.seq_targets != ''
        run: |
          echo "seq: ${{ steps.targets.outputs.seq_targets }}"
          uv run pytest ${{ steps.targets.outputs.seq_targets }} \
            --tb=short \
            --junitxml=test-results-seq.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-pr-gate
          path: |
            test-results.xml
            test-results-seq.xml

  # ------------------------------------------------------------ full matrix --
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          # tests/integration kills xdist workers (a CLI edge-case test
          # hard-exits the process); tests/performance asserts wall-clock
          # budgets — both run sequentially below. Targets are enumerated
          # explicitly: tests/pytest.ini sets rootdir to tests/, which breaks
          # cwd-relative --ignore matching during recursion.
          targets=$(find tests -maxdepth 1 -mindepth 1 \( -type d ! -name performance ! -name integration ! -name __pycache__ \) -o -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
          uv run --with pytest-xdist pytest $targets \
            -n auto \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Run sequential tests (integration / performance)
        run: |
          uv run pytest tests/integration tests/performance \
            --tb=short \
            --cov=src \
            --cov-append \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Black
        run: uv run black --check --diff src/ tests/

      - name: Run isort
        run: uv run isort --check-only --diff src/ tests/

      - name: Run flake8
        run: |
          uv run flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.egg-info,.git,.venv

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: |
          uv run mypy src/worldenergydata/ \
            --ignore-missing-imports \
            --no-error-summary \
            --show-error-codes
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run bandit security scan
        run: |
          uv pip install bandit
          uv run bandit -r src/ -ll -ii -x tests/ || true

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint] # test job skips on unlabeled PRs (module gate covers them)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build documentation
        run: |
          if [ -f docs/conf.py ]; then
            cd docs && uv run sphinx-build -b html . _build/html
          else
            echo "Skipping Sphinx build: docs/conf.py is not present"
          fi
