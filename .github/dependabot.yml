version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    # GitHub Dependabot options reference, rebase-strategy (accessed 2026-10-19):
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#rebase-strategy
    # Keep automatic refresh explicit; strict required checks still apply.
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "vamseeachanta"
    groups:
      # Group all development dependencies
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "isort"
          - "mypy"
          - "pre-commit"
          - "faker"
          - "factory-boy"
          - "types-*"
        update-types:
          - "minor"
          - "patch"
      # Group data science dependencies
      data-science:
        patterns:
          - "pandas*"
          - "numpy*"
          - "plotly*"
        update-types:
          - "minor"
          - "patch"
      # Group web scraping dependencies
      web-scraping:
        patterns:
          - "scrapy*"
          - "selenium*"
          - "beautifulsoup*"
        update-types:
          - "minor"
          - "patch"
      # Same reference, groups and update-types: related version updates share
      # a PR. These groups admit only minor/patch version updates.
      validation:
        patterns:
          - "pydantic"
          - "pydantic-settings"
        update-types:
          - "minor"
          - "patch"
      documentation:
        patterns:
          - "sphinx*"
          - "mkdocs*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    # Keep the documented default explicit for action updates as well.
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
