[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldenergydata"
version = "0.1.0"
description = "Standardized project configuration for worldenergydata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Shared core — carved out as the first uv workspace member (ADR 0001
    # Phase 2 PR #1). Provides worldenergydata.common; resolved from the
    # in-repo workspace member via [tool.uv.sources] below.
    "worldenergydata-core",
    # Isolated/leaf domains carved into workspace members (ADR 0001 Phase 2
    # batch 1, #529). Each ships worldenergydata.<domain> from its own member;
    # the root distribution depends on them so `import worldenergydata.<domain>`
    # keeps working transparently. Resolved in-repo via [tool.uv.sources].
    "worldenergydata-economics",
    "worldenergydata-cost",
    "worldenergydata-eia",
    "worldenergydata-eia_us",
    "worldenergydata-decommissioning",
    "worldenergydata-west_africa",
    "worldenergydata-ukcs",
    "worldenergydata-sodir",
    "worldenergydata-brazil_anp",
    "worldenergydata-canada",
    "worldenergydata-mexico_cnh",
    "worldenergydata-texas_rrc",
    "worldenergydata-kansas_kgs",
    # Phase 2 batch 2 (#529): next-most-isolated leaf domains carved into members.
    "worldenergydata-landman",
    "worldenergydata-metocean",
    "worldenergydata-pipeline_safety",
    "worldenergydata-production",
    "worldenergydata-drilling_pressure_management",
    "worldenergydata-well_bore_design",
    "worldenergydata-well_planning",
    "worldenergydata-dashboard",
    "worldenergydata-reporting",
    "worldenergydata-subsea",
    # Phase 2 batch 3 (#529): the coupled BSEE cluster carved as ONE member
    # (bsee + lower_tertiary + hse + well_production_dashboard ship together —
    # bsee<->lower_tertiary import cycle + hse/wpd import bsee).
    "worldenergydata-bsee",
    # fdas carved out to its own source-agnostic economics member (#714); the
    # bsee cluster and this root meta-package both depend on it. The documented
    # `bsee<->fdas` cycle was refuted — fdas is a shared LEAF (nothing in fdas
    # imports bsee/lower_tertiary), so it splits cleanly.
    "worldenergydata-fdas",
    # Phase 2 batch 4 (#529): two un-ignored leaf domains (marine_safety,
    # safety_analysis) + the data-coupled trio. vessel_fleet & lng_terminals
    # ship their curated data inside the member (option i); vessel_hull_models
    # keeps its ~38 MB geometry at the workspace-root data/ (option ii).
    "worldenergydata-marine_safety",
    "worldenergydata-safety_analysis",
    "worldenergydata-vessel_fleet",
    "worldenergydata-lng_terminals",
    "worldenergydata-vessel_hull_models",
    # Phase 2 batch 5 (#529): the final tail. scheduler is the top-level
    # data-refresh ORCHESTRATOR (depends on the carved source domains it
    # refreshes; no domain imports it back, so no cycle). reservoir, drilling,
    # baker_hughes, marine are leaf source/analysis domains with smoke gates.
    "worldenergydata-scheduler",
    "worldenergydata-reservoir",
    "worldenergydata-drilling",
    "worldenergydata-baker_hughes",
    "worldenergydata-marine",
    "assetutilities>=0.1.0,<1.0",
    "scrapy>=2.16.0,<3.0",
    "selenium>=4.15.0,<5.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "pdfplumber>=0.11.9,<1.0",
    "sqlalchemy>=2.0.49,<3.0",
    "sqlmodel>=0.0.14,<1.0",
    "fastapi>=0.136.3,<2.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "tenacity>=9.1.4,<10.0",
    # Data processing and analysis
    "numpy>=2.2.6,<3.0",
    "pandas>=2.3.3,<3.0",
    "scipy>=1.11.0,<2.0",
    # Visualization
    "plotly>=5.18.0,<6.0",
    "dash>=2.14.0,<3.0",
    "seaborn>=0.13.0,<1.0",
    # HTTP client
    "httpx>=0.25.0,<1.0",
    # PDF generation
    "reportlab>=4.0.0,<5.0",
    # Excel support
    "openpyxl>=3.1.0,<4.0",
    "xlsxwriter>=3.1.0,<4.0",
    # Logging
    "loguru>=0.7.0,<1.0",
    # CLI
    "typer>=0.9.0,<1.0",
    "rich>=15.0.0,<16.0",
    "psutil>=7.2.1,<8.0",
    "schedule>=1.2.2,<2.0",
    "pyarrow>=14.0.0,<20.0",
    "scikit-learn>=1.7.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0",
    "faker>=20.1.0",
    "factory-boy>=3.3.3",
    "psutil>=5.9.0",
    "black>=23.0",
    "flake8>=7.3.0",
    "isort>=5.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "types-requests>=2.33.0.20260518",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.4.0",
    "faker>=20.1.0",
    "factory-boy>=3.3.3",
    "psutil>=5.9.0",
    "responses>=0.24.0",
    "hypothesis>=6.100.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=3.1.0",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]
llm = [
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "accelerate>=0.25.0",
]
safety-ml = [
    "scikit-learn>=1.7.2",
    "xgboost>=2.0.0",
    "hyperopt>=0.2.5",
    "joblib>=1.3.0",
]
safety-bert = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentencepiece>=0.1.99",
]
cad = [
    # 3D CAD (B-rep/STEP) for field_development.equipment_3d (#580).
    # Apache-2.0 (CadQuery) over OCCT (LGPL); heavy OCCT/VTK stack — kept an
    # extra so the 2D pipeline installs without it. CadQuery 2.8 needs py>=3.11,
    # so the marker keeps the project's py>=3.10 range resolvable.
    "cadquery>=2.8; python_version >= '3.11'",
]

[project.scripts]
worldenergydata = "worldenergydata.cli.main:app"

[project.urls]
"Homepage" = "https://github.com/username/worldenergydata"
"Bug Tracker" = "https://github.com/username/worldenergydata/issues"
"Documentation" = "https://github.com/username/worldenergydata#readme"

# Package discovery configuration
# Auto-discovers all packages under src/ including:
# - worldenergydata (main package)
# - worldenergydata.cli (unified CLI orchestrator)
# - worldenergydata.common (cross-cutting concerns layer)
# - worldenergydata.modules (domain-specific modules)
# - worldenergydata.analysis (analysis utilities)
# - worldenergydata.validation (data validation)
# - external, modules, validators (other src packages)
[tool.setuptools.packages.find]
where = ["src"]
include = ["worldenergydata*", "external*", "modules*"]
# worldenergydata.common is now shipped by the worldenergydata-core workspace
# member (ADR 0001 Phase 2 PR #1); exclude it here so the root wheel does not
# duplicate it. The root distribution still owns the namespace root
# (src/worldenergydata/__init__.py) and the remaining domain subpackages.
# Phase 2 batch 1 (#529) additionally carves the isolated/leaf domains below
# into their own members — exclude each so the root wheel does not duplicate
# code now shipped by packages/worldenergydata-<domain>/.
exclude = [
    "tests*",
    "docs*",
    "worldenergydata.common",
    "worldenergydata.common.*",
    "worldenergydata.economics",
    "worldenergydata.economics.*",
    "worldenergydata.cost",
    "worldenergydata.cost.*",
    "worldenergydata.eia",
    "worldenergydata.eia.*",
    "worldenergydata.eia_us",
    "worldenergydata.eia_us.*",
    "worldenergydata.decommissioning",
    "worldenergydata.decommissioning.*",
    "worldenergydata.west_africa",
    "worldenergydata.west_africa.*",
    "worldenergydata.ukcs",
    "worldenergydata.ukcs.*",
    "worldenergydata.sodir",
    "worldenergydata.sodir.*",
    "worldenergydata.brazil_anp",
    "worldenergydata.brazil_anp.*",
    "worldenergydata.canada",
    "worldenergydata.canada.*",
    "worldenergydata.mexico_cnh",
    "worldenergydata.mexico_cnh.*",
    "worldenergydata.texas_rrc",
    "worldenergydata.texas_rrc.*",
    "worldenergydata.landman",
    "worldenergydata.landman.*",
    "worldenergydata.metocean",
    "worldenergydata.metocean.*",
    "worldenergydata.pipeline_safety",
    "worldenergydata.pipeline_safety.*",
    "worldenergydata.production",
    "worldenergydata.production.*",
    "worldenergydata.drilling_pressure_management",
    "worldenergydata.drilling_pressure_management.*",
    "worldenergydata.well_bore_design",
    "worldenergydata.well_bore_design.*",
    "worldenergydata.well_planning",
    "worldenergydata.well_planning.*",
    "worldenergydata.dashboard",
    "worldenergydata.dashboard.*",
    "worldenergydata.reporting",
    "worldenergydata.reporting.*",
    "worldenergydata.subsea",
    "worldenergydata.subsea.*",
    # Phase 2 batch 3 (#529): the coupled BSEE cluster, carved as ONE member
    # (packages/worldenergydata-bsee/ ships bsee, lower_tertiary, hse,
    # well_production_dashboard). fdas was carved to its OWN member
    # (packages/worldenergydata-fdas/, #714). Exclude all of them so the root
    # wheel does not duplicate code now shipped by those members.
    "worldenergydata.bsee",
    "worldenergydata.bsee.*",
    "worldenergydata.lower_tertiary",
    "worldenergydata.lower_tertiary.*",
    "worldenergydata.fdas",
    "worldenergydata.fdas.*",
    "worldenergydata.hse",
    "worldenergydata.hse.*",
    "worldenergydata.well_production_dashboard",
    "worldenergydata.well_production_dashboard.*",
    # Phase 2 batch 4 (#529): two un-ignored leaf domains carved into members
    # (packages/worldenergydata-marine_safety/, .../-safety_analysis/) plus the
    # data-coupled trio (vessel_fleet, lng_terminals, vessel_hull_models). Each
    # ships from its own member — exclude all so the root wheel never duplicates
    # the carved code (or, for the option-(i) members, the carved data).
    "worldenergydata.marine_safety",
    "worldenergydata.marine_safety.*",
    "worldenergydata.safety_analysis",
    "worldenergydata.safety_analysis.*",
    "worldenergydata.vessel_fleet",
    "worldenergydata.vessel_fleet.*",
    "worldenergydata.lng_terminals",
    "worldenergydata.lng_terminals.*",
    "worldenergydata.vessel_hull_models",
    "worldenergydata.vessel_hull_models.*",
    # Phase 2 batch 5 (#529): the final tail carved into members
    # (packages/worldenergydata-{scheduler,reservoir,drilling,baker_hughes,marine}/).
    # Exclude each so the root wheel does not duplicate the carved code.
    "worldenergydata.scheduler",
    "worldenergydata.scheduler.*",
    "worldenergydata.reservoir",
    "worldenergydata.reservoir.*",
    "worldenergydata.drilling",
    "worldenergydata.drilling.*",
    "worldenergydata.baker_hughes",
    "worldenergydata.baker_hughes.*",
    "worldenergydata.marine",
    "worldenergydata.marine.*",
]

# Phase 2 batch 3 (#529): the former "worldenergydata.bsee" package-data entry
# moved to packages/worldenergydata-bsee/pyproject.toml along with the carved
# subpackage. The root distribution no longer ships any bsee-cluster files.

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
# Keep all worldenergydata.* in one first-party group even though `common` now
# ships from the separate `worldenergydata-core` workspace member (else isort
# splits worldenergydata.common from worldenergydata.<domain>). (#529)
known_first_party = ["worldenergydata"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
# SINGLE canonical pytest config (#529). The root `pytest.ini` and
# `tests/pytest.ini` were DELETED so there is exactly one config and one
# deterministic rootdir = the repo root (the dir holding this pyproject.toml).
# Previously three configs competed and rootdir flipped between the repo root
# and tests/ depending on the invocation cwd/args, which silently changed test
# node-id prefixes AND (via tests/pytest.ini's norecursedirs) hid whole test
# domains (well_production_dashboard, cost, hse, metocean, pipeline_ci_cd,
# sodir, ukcs, brazil_anp) so they never ran and rotted. Those are now
# un-hidden; see the triage notes on PR #529.
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
console_output_style = "progress"

# norecursedirs: GENUINE non-test excludes ONLY (build/vendor/archive/legacy/
# generated-output dirs). Test domains were removed from here on purpose — do
# NOT re-add a `tests/unit/<domain>` entry; quarantine an individual broken
# node-id in scripts/ci/quarantine.txt instead.
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    "node_modules",
    "build",
    "dist",
    "_archive",
    "_archived_tests",
    "legacy",
    "legacy_*",
    "custom_scripts",
    "output",
    "data",
    "htmlcov",
    ".coverage*",
    "reports",
    "2025-*",
    "comprehensive-report-system",
    "financial-analysis-sme-code",
    "well-data-verification",
]

# Measure by import package name (not a single src/ path): the worldenergydata
# namespace now spans the root distribution AND the worldenergydata-core
# workspace member (ADR 0001 Phase 2 PR #1), so a path-scoped --cov would miss
# common/. --cov=worldenergydata covers the package wherever its modules import
# from.
#
# --ignore entries: genuinely broken / network-bound / wrong-lane test FILES
# only (NOT whole un-hidden domains — those were triaged and now pass). Slow
# or process-killing lanes (tests/performance, tests/integration) are driven
# separately by CI. Individual broken node-ids go to scripts/ci/quarantine.txt.
addopts = """\
--strict-markers \
--cov=worldenergydata \
--cov-report=term-missing \
--cov-report=html:reports/coverage/htmlcov \
--cov-report=xml:reports/coverage/coverage.xml \
--cov-report=json:reports/coverage/coverage.json \
--ignore=tests/performance \
--ignore=tests/modules/bsee/analysis/test_type_curves.py \
--ignore=tests/modules/fdas/integration/test_end_to_end.py \
--ignore=tests/modules/sodir-integration \
--ignore=tests/modules/well_production_dashboard/test_monitoring.py \
--ignore=tests/modules/well_production_dashboard/test_well_production_dashboard.py \
--ignore=tests/unit/bsee/analysis/query_api_01_wells_api12_rig_days_Tiber_test.py \
--ignore=tests/unit/bsee/analysis/query_api_01_wells_api12_test.py \
--ignore=tests/unit/bsee/analysis/query_api_01_wells_directional_survey_test.py \
--ignore=tests/unit/bsee/analysis/query_api_multiple_wells_rig_days_test.py \
--ignore=tests/unit/bsee/analysis/query_field_anchor_test.py \
--ignore=tests/unit/bsee/analysis/query_field_jack_stmalo_npv_test.py \
--ignore=tests/unit/bsee/analysis/query_lease_test.py\
"""

markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (multiple components)",
    "slow: Slow tests (>1 second execution)",
    "llm: LLM/AI tests (external API calls)",
    "scrapy: Web scraping tests",
    "selenium: Browser automation tests",
    "database: Database integration tests",
    "api: API endpoint tests",
    "etl: ETL pipeline tests",
    "data_validation: Data validation and verification tests",
    "performance: Performance and benchmark tests",
    "benchmark: Benchmark performance tests",
    "smoke: Smoke tests for quick validation",
    "regression: Regression tests for existing functionality",
    "network: Tests requiring network access",
    "skip_ci: Tests to skip in CI/CD pipeline",
    "wip: Work-in-progress tests",
    "timeout: Tests with custom timeout settings",
    "asyncio: Asynchronous tests using pytest-asyncio",
    "contracts: Contract tests asserting assetutilities public API stability",
]

filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Both namespace locations: root domains + the carved-out core member (common/).
source = ["src/worldenergydata", "packages/worldenergydata-core/src/worldenergydata"]
omit = ["*/tests/*", "*/test_*.py", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# uv workspace (ADR 0001 — domain-package split, Phase 2 PR #1)
# ---------------------------------------------------------------------------
# ACTIVATED in Phase 2 PR #1, which carves the shared core out as the first
# workspace member. The root `worldenergydata` distribution keeps every domain
# subpackage and the namespace root (src/worldenergydata/__init__.py with
# pkgutil.extend_path) and DEPENDS ON worldenergydata-core for
# worldenergydata.common.
#
# Members (rolled out per the ADR phased plan):
#   packages/worldenergydata-core/  -> worldenergydata-core  (worldenergydata.common; this PR)
#   packages/worldenergydata-<domain>/ -> per-leaf-domain members, later PRs,
#                                      rolled out ISOLATED -> LEAF -> COUPLED
#   (the bsee <-> lower_tertiary cycle ships as ONE member; fdas was carved out
#    to its own member — worldenergydata-fdas, #714 — after its purported cycle
#    with bsee was refuted: fdas is a shared leaf imported BY bsee/lower_tertiary)
#
# Scope note (this PR): core is `common/` ONLY. base_configs/ is per-domain
# config DATA (bsee/fdas/sodir/... yml) referenced by filename, not shared
# infra, so it stays in the root distribution with the domains. _compat.py and
# the namespace root __init__.py stay in the root distribution because exactly
# one distribution may own worldenergydata/__init__.py (ADR risk note), and the
# root is that owner.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# assetutilities ships the deterministic workflow-API contract (workflow_api:
# ResultEnvelope, run_workflow) on `main`, but the published PyPI 0.1.x does not.
# Source it from git main so the contract module resolves in CI (workspace-hub#3286).
assetutilities = { git = "https://github.com/vamseeachanta/assetutilities.git", branch = "main" }
worldenergydata-core = { workspace = true }
# Phase 2 batch 1 (#529): isolated/leaf domain members, resolved from the
# in-repo workspace (the members glob `packages/*` already discovers them).
worldenergydata-economics = { workspace = true }
worldenergydata-cost = { workspace = true }
# fdas carved out of the bsee cluster into its own source-agnostic member (#714)
worldenergydata-fdas = { workspace = true }
worldenergydata-eia = { workspace = true }
worldenergydata-eia_us = { workspace = true }
worldenergydata-decommissioning = { workspace = true }
worldenergydata-west_africa = { workspace = true }
worldenergydata-ukcs = { workspace = true }
worldenergydata-sodir = { workspace = true }
worldenergydata-brazil_anp = { workspace = true }
worldenergydata-canada = { workspace = true }
worldenergydata-mexico_cnh = { workspace = true }
worldenergydata-texas_rrc = { workspace = true }
worldenergydata-kansas_kgs = { workspace = true }
# Phase 2 batch 2 (#529): next-most-isolated leaf domain members.
worldenergydata-landman = { workspace = true }
worldenergydata-metocean = { workspace = true }
worldenergydata-pipeline_safety = { workspace = true }
worldenergydata-production = { workspace = true }
worldenergydata-drilling_pressure_management = { workspace = true }
worldenergydata-well_bore_design = { workspace = true }
worldenergydata-well_planning = { workspace = true }
worldenergydata-dashboard = { workspace = true }
worldenergydata-reporting = { workspace = true }
worldenergydata-subsea = { workspace = true }
# Phase 2 batch 3 (#529): the coupled BSEE cluster as one workspace member.
worldenergydata-bsee = { workspace = true }
# Phase 2 batch 4 (#529): un-ignored leaves + the data-coupled trio.
worldenergydata-marine_safety = { workspace = true }
worldenergydata-safety_analysis = { workspace = true }
worldenergydata-vessel_fleet = { workspace = true }
worldenergydata-lng_terminals = { workspace = true }
worldenergydata-vessel_hull_models = { workspace = true }
# Phase 2 batch 5 (#529): the final tail — scheduler orchestrator + leaf domains.
worldenergydata-scheduler = { workspace = true }
worldenergydata-reservoir = { workspace = true }
worldenergydata-drilling = { workspace = true }
worldenergydata-baker_hughes = { workspace = true }
worldenergydata-marine = { workspace = true }

[tool.uv]
# UV environment configuration
python = "3.11"
system = false
seed = true
compile = true

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = []
no-cache = false
pre = false

# MANDATORY: Parallel Processing Configuration
[tool.parallel]
enabled = true
max_workers = 5
use_threading = false  # Use multiprocessing for CPU-bound tasks
use_asyncio = true     # Use asyncio for I/O-bound tasks
batch_size = 10

[tool.parallel.rules]
# Define when to use parallel processing
file_operations = "always"      # File reading/writing
http_requests = "always"        # API calls
data_processing = "threshold"   # Based on data size
threshold_size = 1000           # Items before parallel kicks in

[tool.scripts]
# Common scripts that use parallel processing
test = "pytest -n auto"
format = "black . && isort ."
lint = "flake8 . & mypy . & pylint ."
install = "uv pip install -e ."
dev-install = "uv pip install -e .[dev]"

[dependency-groups]
benchmark = [
    "pytest-benchmark>=4.0.0,<5.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "faker>=37.8.0",
    "hypothesis>=6.141.1",
    "mypy>=1.18.2",
    "numpy-financial>=1.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "responses>=0.25.8",
    "xmltodict>=1.0.2",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = []
