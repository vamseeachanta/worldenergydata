[tool.poetry]
name = "worldenergydata"
version = "0.0.1"
description = "World Energy Data from Public Sources"
authors = ["Vamsee Achanta <vamsee.achanta@aceengineer.com>"]
license = "MIT"
readme = "README.md"
keywords = ["package", "library", "module"]
homepage = "https://github.com/vamseeachanta/worldenergydata"
repository = "https://github.com/vamseeachanta/worldenergydata"
documentation = "https://github.com/vamseeachanta/worldenergydata/blob/main/README.md"
packages = [{ include = "worldenergydata", from = "src" }]
include = ["*.yml", "*.csv", "*.xlsx", "*.html", "*.txt"]
requires-python = ">=3.7"

[tool.poetry.dependencies]
python = ">=3.7"

[tool.poetry.group.build.dependencies]
build = "^1.0.0"
twine = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0"
bumpver = "^2023.1129"
isort = "^5.0.0"
pytest = "^7.0.0"

[tool.poetry.group.local.dependencies]
assetutilities = { path = "../assetutilities", develop = true }

[tool.poetry.scripts]
energy_data = "worldenergydata.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bumpver]
current_version = "0.0.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/worldenergydata/__init__.py" = ["{version}"]
"src/worldenergydata/__main__.py" = ["- worldenergydata v{version}"]

[tool.isort]
profile = "black"
import_heading_stdlib = "Standard library imports"
import_heading_thirdparty = "Third party imports"
import_heading_firstparty = "Reader imports"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
