# Derived from, and deliberately stricter than, the shared workspace-hub scanner configuration.
# Default rules are loaded and path entries narrowed for standalone checkouts and git worktrees.
# The shared file should gain the default-rule extension; this file should retain it.
title = "World Energy Data gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives"
regexes = [
  # Variable name contains test/example/placeholder (weak but retained for compat)
  '''(?i)(example|placeholder|test|fake|dummy|sample|mock)_?(token|key|secret|password|api_?key)\s*=\s*["\']?[^"\']{0,50}["\']?''',
  # Placeholder value patterns (angle brackets, YOUR_, etc.)
  '''(?i)(=|:)\s*["\']?(<[^>]+>|YOUR_[A-Z_]+|EXAMPLE_[A-Z_]+|\$\{[^}]+\}|xxx+|aaa+)["\']?$''',
  '''TODO.*token''',
]
paths = [
  '''^\.gitleaks\.toml$''',
]
