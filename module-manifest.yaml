# ─── SUPPORTING MODULES (infrastructure, not data sources) ──────────────────
#
# The following packages exist under src/worldenergydata/ but are infrastructure
# rather than standalone data-source modules; they are omitted from the discovery
# index above:
#
#   analysis           — shared analysis utilities
#   base_configs       — shared base configuration classes
#   cli                — top-level CLI entry point
#   common             — shared utilities (logging, types, units)
#   engine             — orchestration engine
#   modules            — module registry / catalog
#   production         — generic production utilities (shared across regions)
#   reporting          — shared reporting infrastructure
#   safety_analysis    — generalized ML/NLP safety analysis toolkit (feeds hse + marine_safety)
#   scheduler          — automated data refresh scheduler (WRK-076)
#   testing            — shared test utilities
#   validation         — shared validation rules and schemas
#   well_production_dashboard — interactive Plotly dashboard wrapping bsee production (WRK-019, WRK-021, WRK-042)
#
# ─── SCHEDULER GAPS (WRK-076 candidates) ─────────────────────────────────────
#
# Modules with update_frequency monthly or daily but in_scheduler: false.
# These should be wired into the WRK-076 scheduler to fulfil the automated
# collection commitment made on the aceengineer website.
#
#   - hse:              monthly, not in scheduler  (BSEE incident import)
#   - pipeline_safety:  annual,  not in scheduler  (PHMSA batch download)
#   - landman:          on_demand — scheduler not applicable; pull on request
#   - canada:           monthly, not in scheduler  (config/canada.yml exists, no job adapter)
#   - marine_safety:    monthly, not in scheduler  (WRK-076 plan calls for marine_safety_refresh.py, not yet created)
#   - lng_terminals:    annual,  not in scheduler  (dataset is largely static; low priority)
#
# Priority order for WRK-076 wiring:
#   1. canada       — config already exists, just needs jobs/canada_refresh.py adapter
#   2. hse          — high-value incident data; pairs with bsee (already scheduled)
#   3. marine_safety — WRK-076 plan explicitly lists marine_safety_refresh.py as Phase 2 deliverable
#   4. pipeline_safety — annual cadence makes manual fetch acceptable short-term
