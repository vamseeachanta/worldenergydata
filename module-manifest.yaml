# ─── SCHEDULER GAPS (WRK-076 candidates) ──────────────────────────────────────
#
# Modules with monthly/daily update_frequency but in_scheduler: false:
#   - canada:           monthly (config/canada.yml exists, no scheduler job adapter)
#   - hse:              monthly (BSEE incident import; pairs with bsee which is scheduled)
#   - marine_safety:    monthly (WRK-076 Phase 2 explicitly calls for marine_safety_refresh.py)
#   - pipeline_safety:  annual  (PHMSA batch; manual fetch acceptable short-term)
#   - lng_terminals:    annual  (dataset largely static; low priority)
#
# Priority: canada → hse → marine_safety → pipeline_safety → lng_terminals
#
# ─── NOT IN THIS MANIFEST ───────────────────────────────────────────────────────
#
# The following are module-level files, not packages, or are compat shims:
#   engine.py        — orchestration engine (top-level file, not a package)
#   _compat.py       — backward-compat redirect shim (worldenergydata.modules.X)
#   cli/             — top-level CLI entry point (not a data module)
#   base_configs/    — shared base configuration classes (not a data module)
#   modules/         — deprecated compat namespace; redirects to worldenergydata.<name>
