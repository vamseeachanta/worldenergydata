" stroke-width="2" fill="#ac501e" data-year="2019"><title>Within five years, 2019. Annual value 3.51. Five year mean unavailable.</title></circle><circle cx="764.00" cy="347.95" r="5" stroke="#ac501e" stroke-width="2" fill="#ac501e" data-year="2020"><title>Within five years, 2020. Annual value 2.62. Five year mean unavailable.</title></circle></g><text x="22" y="506">Observed by file date includes first qualifying spuds through the November 2026 borehole</text><text x="22" y="528">file. Within five years stops at the fifth anniversary. Both use leases effective from</text><text x="22" y="550">2005 through 2020. Medians include only leases with a qualifying spud.</text><text x="22" y="572">Source records are unavailable for 13 annual series observations. The chart omits those</text><text x="22" y="594">points and any mean requiring them. The interactive year table identifies the affected</text><text x="22" y="616">series.</text></svg>
