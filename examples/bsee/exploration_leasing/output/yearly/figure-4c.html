<script>
const series = [[[2005,null,null,false,"unavailable"],[2006,null,null,false,"unavailable"],[2007,null,null,false,"unavailable"],[2008,null,null,false,"unavailable"],[2009,null,null,false,"unavailable"],[2010,null,null,false,"unavailable"],[2011,null,null,false,"verified"],[2012,null,null,false,"unavailable"],[2013,null,null,false,"unavailable"],[2014,null,null,false,"unavailable"],[2015,null,null,false,"unavailable"],[2016,null,null,false,"unavailable"],[2017,null,null,false,"unavailable"],[2018,null,null,false,"unavailable"],[2019,null,null,false,"unavailable"],[2020,0.0,null,false,"verified"]],[[2005,null,null,false,"unavailable"],[2006,null,null,false,"unavailable"],[2007,null,null,false,"unavailable"],[2008,null,null,false,"unavailable"],[2009,null,null,false,"unavailable"],[2010,0.0,null,false,"verified"],[2011,null,null,false,"verified"],[2012,0.0,null,false,"verified"],[2013,0.0,null,false,"verified"],[2014,0.0,null,false,"verified"],[2015,null,null,false,"unavailable"],[2016,null,null,false,"unavailable"],[2017,null,null,false,"unavailable"],[2018,null,null,false,"unavailable"],[2019,null,null,false,"unavailable"],[2020,0.0,null,false,"verified"]],[[2005,null,null,false,"unavailable"],[2006,null,null,false,"unavailable"],[2007,null,null,false,"unavailable"],[2008,null,null,false,"unavailable"],[2009,null,null,false,"unavailable"],[2010,null,null,false,"unavailable"],[2011,null,null,false,"unavailable"],[2012,null,null,false,"unavailable"],[2013,null,null,false,"unavailable"],[2014,null,null,false,"unavailable"],[2015,0.0,null,false,"verified"],[2016,0.0,null,false,"verified"],[2017,0.0,null,false,"verified"],[2018,0.0,null,false,"verified"],[2019,0.0,0.0,false,"verified"],[2020,2.2222222222222223,0.4444444444444445,false,"verified"]],[[2005,0.0,null,false,"verified"],[2006,0.0,null,false,"verified"],[2007,0.0,null,false,"verified"],[2008,0.0,null,false,"verified"],[2009,0.0,0.0,false,"verified"],[2010,null,null,false,"unavailable"],[2011,null,null,false,"unavailable"],[2012,null,null,false,"unavailable"],[2013,null,null,false,"unavailable"],[2014,null,null,false,"unavailable"],[2015,null,null,false,"unavailable"],[2016,null,null,false,"unavailable"],[2017,null,null,false,"unavailable"],[2018,null,null,false,"unavailable"],[2019,null,null,false,"unavailable"],[2020,0.0,null,false,"verified"]]];
const select = document.querySelector('#year');
const chart = document.querySelector('svg');
chart.setAttribute('role', 'group');
const groups = [...chart.querySelectorAll('[data-series]')];
const legends = [...chart.querySelectorAll('[data-legend]')];
const format = new Intl.NumberFormat('en-US', {maximumFractionDigits: 3});
function update() {
  const tbody = document.querySelector('#readout');
  tbody.replaceChildren();
  for (const [index, group] of groups.entries()) {
    if (group.style.display === 'none') continue;
    const [, value, average, , availability] = series[index][select.selectedIndex];
    const row = tbody.insertRow();
    const label = document.createElement('th');
    label.scope = 'row';
    label.textContent = group.dataset.label;
    row.append(label);
    const blank = availability === 'unavailable' ? 'Source records unavailable' : 'No eligible value';
    row.insertCell().textContent = value === null ? blank : format.format(value);
    row.insertCell().textContent = average === null ? 'No complete five year window' : format.format(average);
  }
  document.querySelector('#caption').textContent = select.selectedOptions[0].textContent + ' · Share of effective leases (%)';
}
for (const [index, legend] of legends.entries()) {
  legend.setAttribute('role', 'button');
  legend.setAttribute('tabindex', '0');
  legend.setAttribute('aria-pressed', 'true');
  legend.setAttribute('aria-label', groups[index].dataset.label);
  function toggle() {
    const visible = legend.getAttribute('aria-pressed') === 'true';
    groups[index].style.display = visible ? 'none' : '';
    legend.setAttribute('aria-pressed', String(!visible));
    update();
  }
  legend.addEventListener('click', toggle);
  legend.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggle();
    }
  });
}
function inspect(event) {
  const point = event.target.closest('[data-year]');
  if (point) {
    select.value = point.dataset.year;
    update();
  }
}
chart.addEventListener('pointerover', inspect);
chart.addEventListener('click', inspect);
select.addEventListener('change', update);
update();
</script>
