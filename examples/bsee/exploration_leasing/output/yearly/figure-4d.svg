<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Median time to first crude by block water depth" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="16" fill="#203340" width="800" height="594" viewBox="0 0 800 594"><title>Median time to first crude by block water depth</title><rect width="800" height="594" fill="white" /><text x="22" y="32" font-size="22" font-weight="bold">Median time to first crude by block water depth</text><text x="22" y="58">Markers and thin lines show annual values. Thick, lighter lines show the 5 year trailing mean.</text><g data-legend="0"><rect x="62" y="70" height="27" width="154" fill="white" /><line x1="68" y1="83" x2="100" y2="83" stroke="#6588a6" stroke-width="3" /><text x="106" y="88">Under 100 m</text></g><g data-legend="1"><rect x="227" y="70" height="27" width="163" fill="white" /><line x1="233" y1="83" x2="265" y2="83" stroke="#427298" stroke-width="3" /><text x="271" y="88">100 to 500 m</text></g><g data-legend="2"><rect x="401" y="70" height="27" width="181" fill="white" /><line x1="407" y1="83" x2="439" y2="83" stroke="#245476" stroke-width="3" /><text x="445" y="88">500 to 1,500 m</text></g><g data-legend="3"><rect x="62" y="100" height="27" width="217" fill="white" /><line x1="68" y1="113" x2="100" y2="113" stroke="#102e46" stroke-width="3" /><text x="106" y="118">1,500 m and deeper</text></g><text x="68" y="163" font-weight="bold">Median time from effectiveness (years)</text><line x1="68" x2="764" y1="450.0" y2="450.0" stroke="#cfd9de" /><text x="59" y="455.0" text-anchor="end">0</text><line x1="68" x2="764" y1="395.0" y2="395.0" stroke="#cfd9de" /><text x="59" y="400.0" text-anchor="end">1</text><line x1="68" x2="764" y1="340.0" y2="340.0" stroke="#cfd9de" /><text x="59" y="345.0" text-anchor="end">2</text><line x1="68" x2="764" y1="285.0" y2="285.0" stroke="#cfd9de" /><text x="59" y="290.0" text-anchor="end">3</text><line x1="68" x2="764" y1="230.0" y2="230.0" stroke="#cfd9de" /><text x="59" y