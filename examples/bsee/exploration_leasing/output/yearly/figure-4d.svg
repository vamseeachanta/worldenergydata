<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Median time to first crude by block water depth" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="16" fill="#203340" width="800" height="660" viewBox="0 0 800 660"><title>Median time to first crude by block water depth</title><rect width="800" height="660" fill="white" /><text x="22" y="32" font-size="22" font-weight="bold">Median time to first crude by block water depth</text><text x="22" y="58">Markers and thin lines show annual values. Thick, lighter lines show the 5 year trailing mean.</text><g data-legend="0"><rect x="62" y="70" height="27" width="154" fill="white" /><line x1="68" y1="83" x2="100" y2="83" stroke="#6588a6" stroke-width="3" /><text x="106" y="88">Under 100 m</text></g><g data-legend="1"><rect x="227" y="70" height="27" width="163" fill="white" /><line x1="233" y1="83" x2="265" y2="83" stroke="#427298" stroke-width="3" /><text x="271" y="88">100 to 500 m</text></g><g data-legend="2"><rect x="401" y="70" height="27" width="181" fill="white" /><line x1="407" y1="83" x2="439" y2="83" stroke="#245476" stroke-width="3" /><text x="445" y="88">500 to 1,500 m</text></g><g data-legend="3"><rect x="62" y="100" height="27" width="217" fill="white" /><line x1="68" y1="113" x2="100" y2="113" stroke="#102e46" stroke-width="3" /><text x="106" y="118">1,500 m and deeper</text></g><text x="68" y="163" font-weight="bold">Median time from effectiveness (years)</text><line x1="68" x2="764" y1="450.0" y2="450.0" stroke="#cfd9de" /><text x="59" y="455.0" text-anchor="end">0</text><line x1="68" x2="764" y1="395.0" y2="395.0" stroke="#cfd9de" /><text x="59" y="400.0" text-anchor="end">1</text><line x1="68" x2="764" y1="340.0" y2="340.0" stroke="#cfd9de" /><text x="59" y="345.0" text-anchor="end">2</text><line x1="68" x2="764" y1="285.0" y2="285.0" stroke="#cfd9de" /><text x="59" y="290.0" text-anchor="end">3</text><line x1="68" x2="764" y1="230.0" y2="230.0" stroke="#cfd9de" /><text x="59" y="235.0" text-anchor="end">4</text><line x1="68" x2="764" y1="175.0" y2="175.0" stroke="#cfd9de" /><text x="59" y="180.0" text-anchor="end">5</text><text x="68.0" y="477" text-anchor="middle">2005</text><text x="300.0" y="477" text-anchor="middle">2010</text><text x="532.0" y="477" text-anchor="middle">2015</text><text x="764.0" y="477" text-anchor="middle">2020</text><text x="416.0" y="504" text-anchor="middle" font-weight="bold">Lease effective year</text><g data-series="0" data-label="Under 100 m" /><g data-series="1" data-label="100 to 500 m" /><g data-series="2" data-label="500 to 1,500 m"><path d="M764.00,184.17l0,0" fill="none" stroke="#245476" stroke-width="2" stroke-linecap="round" class="annual" /><circle cx="764.00" cy="184.17" r="5" stroke="#245476" stroke-width="2" fill="#245476" data-year="2020"><title>500 to 1,500 m, 2020. Annual value 4.833. Five year mean unavailable.</title></circle></g><g data-series="3" data-label="1,500 m and deeper" /><text x="22" y="536">Leases effective from 2005 through 2020 have 60 complete reporting months. First crude is</text><text x="22" y="558">the first positive crude oil month in months 0 through 59.</text><text x="22" y="580">Source records are unavailable for 44 annual series observations. The chart omits those</text><text x="22" y="602">points and any mean requiring them. The interactive year table identifies the affected</text><text x="22" y="624">series.</text></svg>
