<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leases reaching first crude across all water depths" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="16" fill="#203340" width="800" height="652" viewBox="0 0 800 652"><title>Leases reaching first crude across all water depths</title><rect width="800" height="652" fill="white" /><text x="22" y="32" font-size="22" font-weight="bold">Leases reaching first crude across all water depths</text><text x="22" y="58">Markers and thin lines show annual values. Thick, lighter lines show the 5 year trailing mean.</text><g data-legend="0"><rect x="62" y="70" height="27" width="316" fill="white" /><line x1="68" y1="83" x2="100" y2="83" stroke="#245476" stroke-width="3" /><text x="106" y="88">First crude within five years</text></g><text x="68" y="133" font-weight="bold">Share of effective leases (%)</text><line x1="68" x2="764" y1="420.0" y2="420.0" stroke="#cfd9de" /><text x="59" y="425.0" text-anchor="end">0</text><line x1="68" x2="764" y1="351.25" y2="351.25" stroke="#cfd9de" /><text x="59" y="356.25" text-anchor="end">0.5</text><line x1="68" x2="764" y1="282.5" y2="282.5" stroke="#cfd9de" /><text x="59" y="287.5" text-anchor="end">1</text><line x1="68" x2="764" y1="213.75" y2="213.75" stroke="#cfd9de" /><text x="59" y="218.75" text-anchor="end">1.5</text><line x1="68" x2="764" y1="145.0" y2="145.0" stroke="#cfd9de" /><text x="59" y="150.0" text-anchor="end">2</text><text x="68.0" y="447" text-anchor="middle">2005</text><text x="300.0" y="447" text-anchor="middle">2010</text><text x="532.0" y="447" text-anchor="middle">2015</text><text x="764.0" y="447" text-anchor="middle">2020</text><text x="416.0" y="474" text-anchor="middle" font-weight="bold">Lease effective year</text><g data-series="0" data-label="First crude within five years"><path d="M764.00,245.95l0,0" fill="none" stroke="#245476" stroke-width="2" stroke-linecap="round" class="annual" /><circle cx="764.00" cy="245.95" r="5" stroke="#245476" stroke-width="2" fill="#245476" data-year="2020"><title>First crude within five years, 2020. Annual value 1.266. Five year mean unavailable.</title></circle></g><text x="22" y="506">Leases effective from 2005 through 2020 have 60 complete reporting months. First crude is</text><text x="22" y="528">the first positive crude oil month in months 0 through 59.</text><text x="22" y="550">Source records are unavailable for 15 annual series observations. The chart omits those</text><text x="22" y="572">points and any mean requiring them. The interactive year table identifies the affected</text><text x="22" y="594">series.</text><text x="22" y="616">Y maximum 2, against 5 in Figure 4C.</text></svg>
