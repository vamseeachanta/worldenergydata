  <text x="480.0" y="917" font-size="19" text-anchor="middle" font-weight="bold">Calendar year of approval</text>
  <text x="32" y="947" font-size="17">The denominator is the number of wells standing on 1 January. The numerator includes approvals for</text>
  <text x="32" y="970" font-size="17">wells first drilled later in the year. An empty denominator gives a blank. Hollow markers show partial</text>
  <text x="32" y="993" font-size="17">2026 through 23 November 2026. Means end in 2025.</text>
