schema_version: 1
retrieval_date: '2026-11-12'
currency: Unescalated 2015 study USD; later and earlier duration sources change time only, not currency.
method: cost = total spread dayrate x duration + mobilisation. Scenario ranges, not confidence intervals,
  bids or observed averages.
assumptions:
- Dry-tree casing-jack spread used for both platform bands. A jackup/liftboat quote for the requested
  heavy-work scope is not established.
- MODU heavy scope used for both deeper bands. A riserless vessel serves lighter work and is not priced
  here.
- Quoted total spreads include the study's services. No extra materials, logistics, standby, weather or
  engineering markups are added.
- 'No total Gulf expenditure is estimated: administrative, light, temporary and repeated approvals cannot
  be priced as one heavy event each.'
