    APD: data/modules/bsee/bin/apd
    apm:
      zip: data/modules/bsee/zip/apm
      bin: data/modules/bsee/bin/apm
      columns:
      - - MMS_COMPANY_NUM
        - API_WELL_NUMBER
        - WATER_DEPTH
        - WELL_NM_BP_SFIX
        - WELL_NM_ST_SFIX
        - SURF_AREA_CODE
