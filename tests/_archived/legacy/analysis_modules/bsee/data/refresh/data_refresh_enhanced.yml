# Enhanced BSEE Data Refresh Configuration - Full Features
# This configuration enables all three optimization techniques:
# 1. Chunk-based change detection
# 2. Parallel zip file processing  
# 3. Optimized chunked DataFrame processing

meta:
  library: worldenergydata
  basename: bsee
  mode: enhanced  # This enables enhanced mode

# Enhanced mode flag (alternative way to enable)
enhanced_mode: true

# Enable chunk-based downloads and caching
chunked_refresh: true
incremental_update: true
force_refresh: false  # Set to true to bypass cache

# Data type flags - what to refresh
data:
  # Enhanced mode uses these flags directly (no 'refresh' flag needed)
  well: false       # Enable well data refresh
  war: true       # Disable WAR for faster testing (120MB+ file)
  production: false # Enable production data refresh
  
  # Legacy compatibility flags (also work in enhanced mode)
  apm: false       # Alternative flag for well data

# Processing configuration
processing:
  in_memory: true           # Process in memory without disk storage
  save_zip: false          # Don't save zip files to disk
  chunk_size: 8192         # Chunk size for streaming
  timeout: 600             # Timeout in seconds (10 minutes)
  optimized: true          # Enable optimized processing
  parallel: true           # Enable parallel processing

# Cache configuration
cache:
  enabled: true
  directory: ~/.worldenergydata/cache
  ttl_hours: 24            # Cache time-to-live in hours
  chunk_size_mb: 10        # Size of each download chunk in MB
  max_size_gb: 5           # Maximum total cache size in GB

# Logging configuration
default:
  log_level: INFO

# Performance tuning
performance:
  max_workers: 4           # Number of parallel workers
  memory_limit_mb: 2000    # Memory limit for processing
  chunk_rows: 50000        # Rows per chunk for DataFrame processing