[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info .pytest_cache reports/coverage/htmlcov build dist legacy* _archived_tests _archive test_validators_data_validator.py unit/bsee modules/bsee/analysis unit/cost unit/hse unit/metocean unit/pipeline_ci_cd unit/sodir unit/ukcs well_production_dashboard brazil_anp comprehensive-report-system financial-analysis-sme-code well-data-verification fdas/integration marine_safety sodir-integration 2025-08-*

# Minimum pytest version (not Python)
minversion = 7.0

# Command line options defaults
addopts = 
    --strict-markers
    --tb=short
    --maxfail=5
    --verbose
    -ra

# Custom markers
markers =
    unit: Unit tests - fast, isolated tests of individual components
    integration: Integration tests - test component interactions
    performance: Performance tests - benchmark and timing tests
    data_validation: Data validation tests - verify data quality
    slow: Slow tests - tests that take more than 1 second
    smoke: Smoke tests - quick verification tests
    regression: Regression tests - tests for previously fixed bugs
    api: API tests - tests for external API interactions
    database: Database tests - tests requiring database access
    network: Network tests - tests requiring network access
    skip_ci: Skip in CI - tests that should not run in CI/CD
    wip: Work in progress - tests under development
    timeout: Tests with custom timeout settings
    benchmark: Benchmark tests - performance benchmarking tests
    contracts: Contract tests asserting assetutilities public API stability

# Coverage settings
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */legacy/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = reports/coverage/htmlcov

# Timeout settings
[tool:pytest:timeout]
timeout = 300
timeout_method = thread

# Parallel execution settings
[tool:pytest:xdist]
numprocesses = auto
