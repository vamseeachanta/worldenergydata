# Enhanced BSEE Data Refresh Configuration
# This configuration enables the enhanced parallel data refresh system
# with fresh data access and in-memory processing

meta:
  library: worldenergydata
  basename: bsee
  mode: enhanced  # Set to 'enhanced' for new system or 'legacy' for old system
  description: Enhanced data refresh with fresh data access

# Data type flags (no 'refresh' flag to avoid legacy system activation)
data:
  well: False      # Process well (APD) data
  war: True        # Process WAR data (NEW in enhanced)
  production: False # Process production data

# Processing configuration specific to enhanced mode
processing:
  in_memory: True        # Process data in memory
  save_zip: False        # Don't save zip files to disk
  chunk_size: 8192       # Download chunk size in bytes
  timeout: 300           # Download timeout in seconds
  max_retries: 3         # Maximum retry attempts
  retry_delay: 5         # Delay between retries in seconds

# Memory management
memory:
  max_file_size_mb: 500      # Maximum file size to process in memory
  warning_threshold_mb: 200  # Warn if file exceeds this size

# Validation settings
validation:
  check_data_integrity: True
  verify_column_names: True
  validate_date_ranges: True

# Performance monitoring
monitoring:
  track_download_time: True
  track_processing_time: True
  track_memory_usage: True
  report_metrics: True