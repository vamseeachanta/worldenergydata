basename: bsee
type:
  data: false
  analysis: false
  results: false
parameters:
  filepath:
    data: data/modules/bsee/data
    bin_dir: data/modules/bsee/bin
    Well_APD_Default: data/modules/bsee/bin/Well_APD_Default
    production:
      zip: data\modules\bsee\zip\production_raw
      bin: data/modules/bsee/bin/production_raw
    APD: data/modules/bsee/bin/apd
    apm:
      zip: data/modules/bsee/zip/apd
      bin: data/modules/bsee/bin/apd
      columns:
      - - MMS_COMPANY_NUM
        - API_WELL_NUMBER
        - WATER_DEPTH
        - WELL_NM_BP_SFIX
        - WELL_NM_ST_SFIX
        - SURF_AREA_CODE
        - SURF_BLOCK_NUM
        - SURF_LEASE_NUM
        - BOTM_AREA_CODE
        - BOTM_BLOCK_NUM
        - BOTM_LEASE_NUM
        - RIG_ID_NUM
        - BOREHOLE_STAT_CD
        - WELL_TYPE_CODE
        - BUS_ASC_NAME
    well:
      bin: data/modules/bsee/bin/apd
    war:
      bin: data/modules/bsee/bin/war
  max_allowed_npt: 90
  borehole_codes:
  - BOREHOLE_STAT_CD: APD
    BOREHOLE_STAT_DESC: APPLICATION FOR PERMIT TO DRILL
  - BOREHOLE_STAT_CD: AST
    BOREHOLE_STAT_DESC: APPROVED SIDETRACK
  - BOREHOLE_STAT_CD: CNL
    BOREHOLE_STAT_DESC: BOREHOLE IS CANCELLED. THE REQUEST TO DRILL THE WELL IS CANCELLED
      AFTER THE APD OR SUNDRY HAS BEEN APPROVED. THE STATUS DATE IS THE DATE THE BOREHOLE
      WAS CANCELLED.
  - BOREHOLE_STAT_CD: COM
    BOREHOLE_STAT_DESC: BOREHOLE COMPLETED
  - BOREHOLE_STAT_CD: CT
    BOREHOLE_STAT_DESC: CORE TEST WELL
  - BOREHOLE_STAT_CD: DRL
    BOREHOLE_STAT_DESC: DRILLING ACTIVE
  - BOREHOLE_STAT_CD: DSI
    BOREHOLE_STAT_DESC: DRILLING SUSPENDED
  - BOREHOLE_STAT_CD: PA
    BOREHOLE_STAT_DESC: PERMANENTLY ABANDONED
  - BOREHOLE_STAT_CD: ST
    BOREHOLE_STAT_DESC: BOREHOLE SIDETRACKED
  - BOREHOLE_STAT_CD: TA
    BOREHOLE_STAT_DESC: TEMPORARILY ABANDONED
  - BOREHOLE_STAT_CD: VCW
    BOREHOLE_STAT_DESC: VOLUME CHAMBER WELL
  - BOREHOLE_STAT_CD: PND
    BOREHOLE_STAT_DESC: PENDING
settings_master: ~
data_retrieval:
  well:
    zip:
      BoreholeRawData_mv_boreholes_all: data/modules/bsee/data/zip/BoreholeRawData_mv_boreholes_all.zip
      eWellAPDRawData_mv_apd_main: data/modules/bsee/data/zip/eWellAPDRawData_mv_apd_main.zip
  production: ~
  block: ~
default:
  log_level: INFO
  config:
    overwrite:
      output: true
    cfg_sensitivities: false
  log_enhanced_details: true
meta:
  library: worldenergydata
  basename: bsee
  mode: enhanced
  description: Enhanced data refresh with fresh data access
enhanced_mode: true
data:
  enhanced_refresh: true
  enhanced: true
  fresh_data: true
  well: true
  war: false
  production: false
  apm: false
sources:
  well:
    url: https://www.data.bsee.gov/Well/Files/APDRawData.zip
    display_name: Application for Permit to Drill
    update_frequency: daily
  war:
    url: https://www.data.bsee.gov/Well/Files/eWellWARRawData.zip
    display_name: eWell Submissions WAR
    update_frequency: daily
  production:
    url: https://www.data.bsee.gov/Production/Files/ProductionRawData.zip
    display_name: Production Data
    update_frequency: bi_monthly
  portal:
    url: https://www.data.bsee.gov/Main/RawData.aspx
    display_name: BSEE Raw Data Portal
processing:
  in_memory: true
  save_zip: false
  chunk_size: 8192
  timeout: 300
  max_retries: 3
  retry_delay: 5
memory:
  max_file_size_mb: 500
  warning_threshold_mb: 200
output:
  format: pickle
  compression: None
validation:
  check_data_integrity: true
  verify_column_names: true
  validate_date_ranges: true
monitoring:
  track_download_time: true
  track_processing_time: true
  track_memory_usage: true
  report_metrics: true
