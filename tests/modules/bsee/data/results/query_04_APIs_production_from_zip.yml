  - BOREHOLE_STAT_CD: AST
    BOREHOLE_STAT_DESC: APPROVED SIDETRACK
  - BOREHOLE_STAT_CD: CNL
    BOREHOLE_STAT_DESC: BOREHOLE IS CANCELLED. THE REQUEST TO DRILL THE WELL IS CANCELLED
