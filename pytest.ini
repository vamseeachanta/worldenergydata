[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info .pytest_cache htmlcov build dist legacy_*

# Minimum Python version
minversion = 3.9

# Command line options defaults
addopts = 
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=json
    --cov-branch
    --cov-fail-under=0
    --maxfail=5
    --verbose
    -ra

# Custom markers
markers =
    unit: Unit tests - fast, isolated tests of individual components
    integration: Integration tests - test component interactions
    performance: Performance tests - benchmark and timing tests
    data_validation: Data validation tests - verify data quality
    slow: Slow tests - tests that take more than 1 second
    smoke: Smoke tests - quick verification tests
    regression: Regression tests - tests for previously fixed bugs
    api: API tests - tests for external API interactions
    database: Database tests - tests requiring database access
    network: Network tests - tests requiring network access
    skip_ci: Skip in CI - tests that should not run in CI/CD
    wip: Work in progress - tests under development
    timeout: Tests with custom timeout settings

# Coverage settings
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */legacy/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

# Timeout settings
[tool:pytest:timeout]
timeout = 300
timeout_method = thread

# Parallel execution settings
[tool:pytest:xdist]
numprocesses = auto