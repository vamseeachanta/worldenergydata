[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
norecursedirs = _archived_tests _archive .git .venv venv 2025-* legacy_* custom_scripts output legacy comprehensive-report-system financial-analysis-sme-code well-data-verification 2025-08-02-drilling-completion-output-validation 2025-08-06-data-refresh-architecture data htmlcov .coverage* reports
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (multiple components)
    slow: Slow tests (>1 second execution)
    llm: LLM/AI tests (external API calls)
    scrapy: Web scraping tests
    selenium: Browser automation tests
    database: Database integration tests
    api: API endpoint tests
    etl: ETL pipeline tests
    data_validation: Data validation and verification tests
    performance: Performance and benchmark tests
    benchmark: Benchmark performance tests
    smoke: Smoke tests for quick validation
    regression: Regression tests for existing functionality
    network: Tests requiring network access
    skip_ci: Tests to skip in CI/CD pipeline
    wip: Work-in-progress tests
    asyncio: Asynchronous tests using pytest-asyncio
    contracts: Contract tests asserting assetutilities public API stability

addopts =
    -v
    --tb=short
    --strict-markers
    -x
    --maxfail=5
    --ignore=tests/modules/bsee/analysis/test_type_curves.py
    --ignore=tests/modules/fdas/integration/test_end_to_end.py
    --ignore=tests/modules/sodir-integration/test_api_client.py
    --ignore=tests/modules/sodir-integration/test_cross_regional_validation.py
    --ignore=tests/modules/sodir-integration/test_integration.py
    --ignore=tests/modules/sodir-integration/test_performance.py
    --ignore=tests/modules/well_production_dashboard/test_monitoring.py
    --ignore=tests/modules/well_production_dashboard/test_well_production_dashboard.py
    --ignore=tests/performance
    --ignore=tests/test_infrastructure_smoke.py
    --ignore=tests/unit/test_infrastructure_smoke.py
    --ignore=tests/unit/bsee/analysis/query_api_01_wells_api12_rig_days_Tiber_test.py
    --ignore=tests/unit/bsee/analysis/query_api_01_wells_api12_test.py
    --ignore=tests/unit/bsee/analysis/query_api_01_wells_directional_survey_test.py
    --ignore=tests/unit/bsee/analysis/query_api_multiple_wells_rig_days_test.py
    --ignore=tests/unit/bsee/analysis/query_field_anchor_test.py
    --ignore=tests/unit/bsee/analysis/query_field_jack_stmalo_npv_test.py
    --ignore=tests/unit/bsee/analysis/query_lease_test.py
    --ignore=tests/unit/bsee/analysis/test_production_api12.py
    --ignore=tests/unit/cost/test_proxy_comparison.py
    --ignore=tests/unit/hse/database/test_models.py
    --ignore=tests/unit/hse/importers/test_bsee_incidents_importer_url.py
    --ignore=tests/unit/hse/importers/test_bsee_penalties_importer_url.py
    --ignore=tests/unit/hse/importers/test_bsee_statistics_importer_url.py
    --ignore=tests/unit/metocean/statistics/test_environmental_contours.py
    --ignore=tests/unit/metocean/statistics/test_eva.py
    --ignore=tests/unit/metocean/statistics/test_joint_probability.py
    --ignore=tests/unit/metocean/statistics/test_reporting.py
    --ignore=tests/unit/metocean/statistics/test_scatter_diagram.py
    --ignore=tests/unit/metocean/statistics/test_wave_spectra.py
    --ignore=tests/unit/metocean/statistics/test_weather_windows.py
    --ignore=tests/unit/pipeline_ci_cd/test_pipeline_utils.py
    --ignore=tests/unit/marine_safety
    --ignore=tests/unit/safety_analysis
    # --timeout=300 removed - pytest-timeout not installed

asyncio_mode = strict
console_output_style = progress

filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
