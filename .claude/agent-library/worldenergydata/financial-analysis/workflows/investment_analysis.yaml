name: energy_investment_analysis
version: 1.0.0
description: Comprehensive investment analysis workflow for energy projects

steps:
  - id: data_collection
    name: Collect Project Data
    inputs:
      - project_specifications
      - cost_estimates
      - revenue_projections
      - market_data
    validation:
      required_fields: [capex, opex, project_duration, discount_rate]

  - id: financial_modeling
    name: Build Financial Model
    depends_on: [data_collection]
    operations:
      - calculate_cash_flows
      - apply_depreciation
      - include_tax_effects
      - model_inflation

  - id: metrics_calculation
    name: Calculate Investment Metrics
    depends_on: [financial_modeling]
    metrics:
      - npv
      - irr
      - payback_period
      - lcoe
      - roce

  - id: sensitivity_analysis
    name: Perform Sensitivity Analysis
    depends_on: [metrics_calculation]
    parameters:
      capex: [-20%, -10%, 0%, +10%, +20%]
      opex: [-20%, -10%, 0%, +10%, +20%]
      revenue: [-20%, -10%, 0%, +10%, +20%]

  - id: risk_assessment
    name: Assess Project Risks
    depends_on: [sensitivity_analysis]
    methods:
      - monte_carlo_simulation
      - scenario_analysis
      - var_calculation

  - id: report_generation
    name: Create Investment Report
    depends_on: [risk_assessment]
    outputs:
      - investment_report
      - financial_model
      - risk_analysis
