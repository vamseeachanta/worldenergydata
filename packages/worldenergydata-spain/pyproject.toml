[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldenergydata-spain"
version = "0.1.0"
description = "Spain CORES energy data and field-development chain support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Development Team", email = "dev@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "worldenergydata-core",
    "worldenergydata-fdas",
    "worldenergydata-production",
    "pandas>=2.3.3,<3.0",
    "openpyxl>=3.1.0,<4.0",
]

[project.urls]
"Homepage" = "https://github.com/vamseeachanta/worldenergydata"
"Bug Tracker" = "https://github.com/vamseeachanta/worldenergydata/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldenergydata.spain*"]
namespaces = true

[tool.setuptools.package-data]
"worldenergydata.spain" = [
    "*.md",
    "*.json",
    "**/*.json",
    "**/*.csv",
    "**/*.xlsx",
]
