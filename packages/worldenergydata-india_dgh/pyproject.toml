[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldenergydata-india_dgh"
version = "0.1.0"
description = "India upstream data: DGH bid rounds and awarded blocks, PPAC monthly production, sedimentary basins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Development Team", email = "dev@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Per-domain dependency set (ADR 0001 Phase 2 domain split pattern, #529).
# pdfplumber reads DGH and PPAC tables that are published only as PDF.
dependencies = [
    "worldenergydata-core",
    "pandas>=2.3.3,<3.0",
    "openpyxl>=3.1.0,<4.0",
    "pdfplumber>=0.11.9,<1.0",
    "xlrd>=2.0.1,<3.0",  # PPAC publishes legacy .xls
]

[project.urls]
"Homepage" = "https://github.com/vamseeachanta/worldenergydata"
"Bug Tracker" = "https://github.com/vamseeachanta/worldenergydata/issues"

# PEP 420 namespace packaging (ADR 0001). This member ships ONLY
# ``worldenergydata/india_dgh/`` and its data files; the root distribution owns
# ``worldenergydata/__init__.py``.
[tool.setuptools.packages.find]
where = ["src"]
include = ["worldenergydata.india_dgh*"]
namespaces = true

[tool.setuptools.package-data]
"worldenergydata.india_dgh" = ["*.md", "**/*.md", "**/*.json", "**/*.csv"]
