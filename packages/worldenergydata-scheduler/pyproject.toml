[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldenergydata-scheduler"
version = "0.1.0"
description = "Data-refresh orchestration: scheduled jobs, staleness monitoring, alerting across the carved source domains."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Development Team", email = "dev@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Per-domain dependency set (ADR 0001 Phase 2 — domain split, batch 5 final
# tail, #529). The scheduler is the top-level data-refresh ORCHESTRATOR: its
# per-source refresh jobs import the carved source-domain members, so it depends
# on each of them (plus worldenergydata-core for worldenergydata.common —
# config/logging/data_resolver). No carved domain imports scheduler back, so
# this introduces no dependency cycle.
dependencies = [
    "worldenergydata-core",
    # Source-domain members orchestrated by the refresh jobs
    # (scheduler/jobs/*_refresh.py).
    "worldenergydata-brazil_anp",
    "worldenergydata-bsee",
    "worldenergydata-eia",
    "worldenergydata-metocean",
    "worldenergydata-sodir",
    "worldenergydata-ukcs",
    # Third-party runtime deps measured from the import footprint.
    "pandas>=2.3.3,<3.0",
    "pyarrow>=14.0.0,<20.0",
    "schedule>=1.2.0,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.urls]
"Homepage" = "https://github.com/vamseeachanta/worldenergydata"
"Bug Tracker" = "https://github.com/vamseeachanta/worldenergydata/issues"

# ---------------------------------------------------------------------------
# PEP 420 namespace packaging (ADR 0001 — domain-package split)
# ---------------------------------------------------------------------------
# This member ships ONLY ``worldenergydata/scheduler/``. It does NOT ship
# ``worldenergydata/__init__.py`` — the root ``worldenergydata`` distribution
# remains the SOLE owner of the namespace root ``__init__.py`` (which carries
# ``__version__``, the ``_compat`` legacy redirect, the lazy ``__getattr__``,
# and the ``pkgutil.extend_path`` spanning all install locations).
# ``find_namespace`` + an explicit include keeps setuptools from discovering a
# bare ``worldenergydata`` regular package here.
[tool.setuptools.packages.find]
where = ["src"]
include = ["worldenergydata.scheduler*"]
namespaces = true

[tool.setuptools.package-data]
"worldenergydata.scheduler" = ["*.md", "*.sql", "*.json", "**/*.yml", "**/*.yaml", "**/*.sql", "**/*.md", "**/*.json", "**/*.csv", "**/*.html"]
