# US Gulf of Mexico federal offshore fiscal terms.
#
# CONSUMED: royalty only. Fractions follow this deck's source_ref below;
# the legacy DEFAULT_ASSUMPTIONS table retains its rounded deep-water rates.
# Suite 5 checks the intended royalty change and other component regressions.
# Percentage-to-fraction conversion: NIST SP 811 (2008), section 7.10.2.
schema_version: 1
country: us_gom
currency: USD
price_marker: wti
discount_rate: 0.10          # declarative in v1 (NPV discount seam -> #716)

royalty:
  model: flat
  rate_by_dev_system:
    dry: 0.125               # source_ref below: 12.5% / 100 (original deck, revision 1)
    subsea15: 0.1875         # source_ref below: 18.75% / 100 (original deck, revision 1)
    subsea20: 0.1875         # source_ref below: 18.75% / 100 (original deck, revision 1)
    default: 0.1875          # source_ref below: 18.75% / 100 (original deck, revision 1)

# Declarative income-tax layer (not consumed in v1; PSC/tax seam -> #716).
income_tax:
  federal_cit: 0.21          # US federal corporate income tax (declarative)

source_url: https://www.boem.gov/oil-gas-energy/leasing/lease-and-royalty-information
source_ref: >
  BOEM GoM federal offshore royalty: 12.5% shallow-water, 18.75% deepwater;
  revision 1 was ported from FDAS DEFAULT_ASSUMPTIONS ROYALTY_RATE;
  revision 2 corrects its rounded deep-water fractions to these percentages.
revision: "2"
effective_date: "2026-07-03"
notes: >
  Revision 2 corrects deep-water royalty from 0.188 to 0.1875 to match the
  percentages in the revision-1 source note; legacy DEFAULT_ASSUMPTIONS rates
  remain unchanged. The original effective_date is retained, without inferring
  a new legal effective date. Current legal applicability is NOT_EVALUATED;
  source_url is a provenance lead. federal_cit has no percentage in source_ref
  and remains unqualified under #736. federal_cit and discount_rate are
  declarative metadata only in v1.
