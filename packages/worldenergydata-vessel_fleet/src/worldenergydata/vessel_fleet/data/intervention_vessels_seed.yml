# Dedicated well-intervention fleet -- named seed roster (#598).
#
# The small population of *purpose-built* / dedicated well-intervention units
# that anchor the supply side of Chuck's brief (#588). These are NOT captured
# (or are mis-classified) in the broad curated drilling_rigs / construction
# vessel CSVs, so they are seeded by name here from public vendor research.
#
# confidence: every spec is `vendor_spec` (operator brochure / public spec
#   sheet) -- treat water-depth ratings as approximate nameplate figures.
# vessel_type values map 1:1 onto the asset-class enum used by fleet_catalog:
#   rlwi_monohull         -> rlwi_monohull (light, riser-capable RLWI)
#   heavy_intervention_semi -> heavy_intervention_semi (riser-capable heavy)
#
# Exclusions (deliberate):
#   - Island Innovator: converted to a drilling rig -- no longer an RLWI unit.

provenance:
  source: "public vendor specifications + operator fleet pages (research)"
  confidence: vendor_spec
  compiled_for: "worldenergydata #598 (child of epic #591)"
  notes: >-
    Water-depth ratings are nameplate vendor figures and approximate.
    De-duplication against IMO-keyed curated rows is deferred to #599.

