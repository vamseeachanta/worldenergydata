# Mast rating (lbs) -> HOOKLOAD_RATING_KIPS; setback (lbs) -> SETBACK_CAPACITY_KIPS.
# Where the vendor states a range, the LOWER bound is recorded (a shortlist
# must be defensible; range noted in comments).
