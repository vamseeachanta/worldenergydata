# Saipem offshore drilling fleet specs — wed issue #996 (epic #991).
# 2 ultra-deepwater drillships + 2 harsh-environment semis.
#
# extraction: manual_transcription — Saipem's sheets are a column-collapsed
# marketing layout (0 fields machine-parse; a profile would be overfit for 4
# rigs). Values transcribed from the committed PDFs, 2026-07-13. Build years
# are NOT stated on the sheets -> omitted (unknown != qualified).
# Perro Negro jackup fleet not yet scouted (low spec visibility) — gap noted
# on the issue.
