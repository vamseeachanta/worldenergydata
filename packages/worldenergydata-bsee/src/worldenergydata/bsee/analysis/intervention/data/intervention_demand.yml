  modu_band_distinct_wells_floor: 751
  note: Sums over MODU-servicing bands only; FLOOR (depth-stamped subset).
caveats:
- 'FLOOR: WATER_DEPTH is populated on only ~6% of WAR rows (~94% NULL); every band-resolved
  count is a hard lower bound, not a total.'
- 'FLOOR: rig-days use (WAR_END_DT - WAR_START_DT).days + 1; records with a missing/zero/negative
  span are counted as a single day (a floor), so total_rig_days_floor understates
  true effort.'
- "Depth-null rows are excluded from bands and reported under depth_coverage.records_missing_water_depth\
  \ \u2014 not silently bucketed."
- interventions_per_well counts depth-stamped WAR records as intervention events;
  multiple WAR reports can belong to one campaign, so the rate is an upper proxy on
  the depth-stamped subset.
- 'intervention_rig_days_by_year is recorded operational HISTORY (deepwater workovers
  flat-to-declining per epic #582 / digitalmodel #890), NOT a forward demand trend.'
provenance:
  war_source: BSEE war/mv_war_main.bin (well-activity reports)
  rig_day_convention: (WAR_END_DT - WAR_START_DT).days + 1, inclusive; shared with
    well_rig_days.WellRigDays
