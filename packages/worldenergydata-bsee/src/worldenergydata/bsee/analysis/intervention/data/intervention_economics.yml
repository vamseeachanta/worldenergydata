duration_source: '[engineering-assumption] Representative subsea well-intervention
  campaign durations (typical on-station days incl. routine contingency), by scope:
  riserless light wireline jobs run a few days to ~2 weeks (5-15 d); riser-based through-tubing
  coiled-tubing programs ~2-4 weeks (15-30 d); full workover-riser + subsea-BOP jobs
  (tubing pull / recompletion / ESP change-out / P&A) ~1-2 months (30-60 d). Planning-grade
  ranges from standard GoM deepwater intervention practice / operator AFE norms (e.g.
  SPE intervention literature), NOT a measured BSEE dataset. Mobilization / transit
  for deeper bands is NOT separately added. Overridable via the duration_table argument.'
asset_dayrate_map:
  modu: modu_drillship
  heavy_intervention_semi: heavy_intervention_semi
  rlwi_monohull: rlwi_monohull
  mpsv: mpsv_osv
method: cost_low = dayrate_band_low x duration_low; cost_median = dayrate_median x
  duration_median; cost_high = dayrate_band_high x duration_high. Representative asset
  = eligible_asset_classes[0]; if its day-rate is not public, price off the next eligible
  public asset (MODU/MPSV proxy) or mark unknown.
confidence: 'Indicative planning-grade only. Day-rates are a point-in-time PUBLIC
  snapshot (#596), not a live subscription index; intervention-semi (Helix Q-class)
  and RLWI-monohull day-rates are NOT public and are shown via eligible proxies or
  left unknown, never invented. Campaign durations are an [engineering-assumption]
  (see duration_source). Confidence labels per cell: indicative (public representative
  rate), proxy_modu / proxy_mpsv (priced off an eligible public proxy), unknown (no
  eligible public rate).'
provenance:
  serviceability_matrix: worldenergydata#586
  dayrate_snapshot: worldenergydata#596
  band_scheme: worldenergydata#583 (well_inventory_by_band)
  issue: 'worldenergydata#629 (epic #582)'
