duration_source: '[engineering-assumption] Representative subsea well-intervention
  campaign durations (typical on-station days incl. routine contingency), by scope:
  riserless light wireline jobs run a few days to ~2 weeks (5-15 d); riser-based through-tubing
  coiled-tubing programs ~2-4 weeks (15-30 d); full workover-riser + subsea-BOP jobs
  (tubing pull / recompletion / ESP change-out / P&A) ~1-2 months (30-60 d). Planning-grade
  ranges from standard GoM deepwater intervention practice / operator AFE norms (e.g.
  SPE intervention literature), NOT a measured BSEE dataset. These are the ON-STATION
  SCOPE BASE durations; the per-band mobilization / riser-running adder (BAND_MOBILIZATION_DAYS)
  is applied ON TOP so effective duration and cost vary by depth band. Overridable
  via the duration_table argument.'
band_mobilization_days:
  shelf_lt_500:
    low: 0
    median: 0
    high: 0
  band_500_3000:
    low: 2
    median: 3
    high: 5
  band_3000_5000:
    low: 4
    median: 6
    high: 9
  band_5000_10000:
    low: 7
    median: 10
    high: 14
  band_gt_10000:
    low: 10
    median: 14
    high: 20
mobilization_source: '[engineering-assumption] Per-band mobilization / riser-running
  adder (days), applied on top of the scope BASE on-station duration so effective
  duration and cost scale with water depth. Rationale: deeper bands need more transit
  to/from the (scarce) resident-asset base and substantially longer riser & subsea-BOP
  running/recovery through a deeper water column. Median adder: shelf +0, 500-3,000
  ft +3, 3,000-5,000 ft +6, 5,000-10,000 ft +10, >10,000 ft +14; low/high scale around
  the median. Planning-grade GoM deepwater-intervention practice, NOT a measured BSEE
  dataset. Overridable via the mobilization_table argument.'
asset_dayrate_map:
  modu: modu_drillship
  heavy_intervention_semi: heavy_intervention_semi
  rlwi_monohull: rlwi_monohull
  mpsv: mpsv_osv
method: 'effective_duration = scope base duration + per-band mobilization adder (BAND_MOBILIZATION_DAYS).
  cost_low = dayrate_band_low x effective_duration_low; cost_median = dayrate_median
  x effective_duration_median; cost_high = dayrate_band_high x effective_duration_high.
  Representative asset = eligible_asset_classes[0]; if its day-rate is not public,
  price off the next eligible public asset (MODU/MPSV proxy) or mark unknown. Shelf
  (<500 ft) heavy / through-tubing is jackup-serviced: priced N/A (no public jack-up
  rate) rather than on the deepwater-MODU rate.'
confidence: 'Indicative planning-grade only. Day-rates are a point-in-time PUBLIC
  snapshot (#596), not a live subscription index; intervention-semi (Helix Q-class)
  and RLWI-monohull day-rates are NOT public and are shown via eligible proxies or
  left unknown, never invented. Campaign durations are an [engineering-assumption]
  (see duration_source); the per-band mobilization/riser-running adder (see mobilization_source)
  makes cost VARY BY BAND. Confidence labels per cell: indicative (public representative
  rate), proxy_modu / proxy_mpsv (priced off an eligible public proxy), unknown (no
  eligible public rate), jackup_na (shelf jackup-serviced, deepwater-MODU rate N/A).'
provenance:
  serviceability_matrix: worldenergydata#586
  dayrate_snapshot: worldenergydata#596
  band_scheme: worldenergydata#583 (well_inventory_by_band)
  issue: 'worldenergydata#629 (epic #582)'
