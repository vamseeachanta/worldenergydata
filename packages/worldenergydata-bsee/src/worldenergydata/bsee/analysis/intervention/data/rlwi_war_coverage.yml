  never silently bucketed.
- '''in_war_depth_unknown'' means the vessel IS in WAR but has no depth stamp -- a
  coverage gap, NOT evidence of deepwater absence.'
- '''not_in_war'' in GoM-only WAR means genuine absence from the recorded GoM population;
  many dedicated units are North Sea / Brazil vessels.'
