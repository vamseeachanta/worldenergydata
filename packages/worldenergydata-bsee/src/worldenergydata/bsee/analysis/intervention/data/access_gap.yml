headline: '5,000-10,000 ft holds 270 subsea wells but only 2 GoM-resident heavy-intervention
  unit(s): forward demand would need ~4.4x the rig-days that resident supply can provide
  (access-RISK indicator, NOT a measured crossover).'
framing: 'FORWARD-LOOKING ACCESS RISK, not a measured crossover. Per band: intervention
  demand rig-days/yr (subsea wells x parameterized frequency x band-effective heavy-intervention
  duration) vs available fleet rig-days/yr (eligible fleet x utilization x 365). A
  utilization_ratio > 1 means forward demand would outstrip that supply pool; it is
  an access-risk indicator, not an observed shortfall.'
