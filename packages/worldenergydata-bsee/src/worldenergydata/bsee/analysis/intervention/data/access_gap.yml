parameters:
  intervention_frequency_per_well_per_yr:
    low: 0.1
    central: 0.15
    high: 0.2
  intervention_frequency_source: '[engineering-assumption] Planning intervention frequency
    ~0.1-0.2 per subsea well per year (one intervention every 5-10 years). GoM deepwater
    subsea wells are intervened infrequently; planning-grade range from subsea reliability
    / operator planning norms, NOT a measured BSEE rate. The #630 empirical interventions_per_well
    is carried separately as a cross-check (it is a lifetime upper proxy on the ~6%
    depth-stamped WAR subset, not an annual lambda). Overridable via the frequency
    arg.'
  fleet_utilization:
    low: 0.6
    central: 0.7
    high: 0.8
  fleet_utilization_source: '[engineering-assumption] Practical sustained fleet utilization
    60-80% (nominal availability net of weather, transit, contracting gaps and maintenance).
    Planning-grade; overridable via the utilization arg.'
  days_per_year: 365
  heavy_deepwater_classes:
  - modu_drillship
  - modu_semisub
  - heavy_intervention_semi
  gom_resident_dedicated_total: 3
method: DEMAND rig-days/yr = subsea_wells x frequency x band-effective heavy_dead_well
  duration (#629, depth-scaled). SUPPLY rig-days/yr = eligible_fleet x utilization
  x 365, computed for BOTH the global heavy-deepwater roster and the binding GoM-resident-only
  fleet. GAP = DEMAND - SUPPLY; utilization_ratio = DEMAND / SUPPLY. $ exposure/yr
  = (subsea_wells x frequency) x band heavy $/intervention (#629).
confidence: All figures are [forward_looking_risk] planning-grade indicators, range-valued
  over the parameter low/central/high. They are NOT measured shortfalls. The supply
  uses the heavy-deepwater fleet (MODUs + heavy-intervention semis); the light RLWI
  monohull is excluded from heavy supply.
caveats:
- 'FORWARD-LOOKING: this is access RISK, not a measured demand/supply crossover; both
  parameters (frequency, utilization) are cited planning assumptions, overridable.'
- 'FLOOR: the #630 empirical interventions_per_well cross-check is a lifetime upper
  proxy on the ~6% depth-stamped WAR subset (WATER_DEPTH populated on only ~6% of
  WAR rows, #627/#630), not an annual lambda.'
- 'GEOGRAPHY (#628): GoM has ~0 RESIDENT dedicated LIGHT-intervention vessels -- this
  is geography (the global RLWI fleet is elsewhere) + the 6% WAR coverage, NOT evidence
  that deepwater light intervention is avoided. ~3 GoM-resident dedicated units total
  (#598/#628).'
- 'UNKNOWN 44.5% (#627): a large share of WAR service-type is unclassified, so the
  empirical work mix is incomplete.'
- Demand uses the HEAVY heavy_dead_well duration for all interventions (an upper bound
  on rig-days); real campaigns mix lighter scopes.
- Global-roster supply is a worldwide pool a GoM operator competes for; the GoM-resident
  view is the binding constraint.
- Subsea well counts are [on record] and likely undercount older completions (#583/#589).
