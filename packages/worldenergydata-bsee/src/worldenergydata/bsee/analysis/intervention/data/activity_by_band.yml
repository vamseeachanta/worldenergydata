    band_500_3000: 500-3,000 ft
    band_3000_5000: 3,000-5,000 ft
    band_5000_10000: 5,000-10,000 ft
    band_gt_10000: '> 10,000 ft'
  service_classifier: worldenergydata.bsee.data.loaders.rig_fleet.classify_rig_type
  issue: 'worldenergydata#627 (epic #591)'
