rollup_scheme:
  light:
  - coil_tubing_unit
  - lift_boat
  - snubbing_unit
  - support_vessel
  - wireline_unit
  heavy:
  - drillship
  - inland_barge
  - jack_up
  - platform_rig
  - semi_submersible
  - submersible
  - tender_assisted
  - workover_rig
  other: all remaining service types (e.g. pumping_unit, land_rig, unknown)
caveats:
- 'FLOOR: WATER_DEPTH is populated on only ~6% of WAR rows (~94% NULL); every band-resolved
  count is a hard lower bound, not a total.'
- "Depth-null records are excluded from bands and reported under depth_coverage.records_missing_water_depth\
  \ \u2014 not silently bucketed."
- Service type is heuristic (rig-name pattern match via rig_fleet.classify_rig_type);
  'unknown' covers unmatched / placeholder names.
- distinct_wells per cell counts API_WELL_NUMBER; a well serviced in more than one
  band/service is counted once per cell, and rollup well counts union across the rollup's
  service types.
- 'Recorded deepwater intervention is flat-to-declining (epic #582 / digitalmodel
  #890); this is operational HISTORY, NOT a forward demand trend.'
provenance:
  war_source: BSEE war/mv_war_main.bin (well-activity reports)
  band_scheme_ft:
