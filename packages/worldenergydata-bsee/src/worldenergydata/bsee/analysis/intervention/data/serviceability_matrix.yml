matrix:
  shelf_lt_500:
    light_live_well:
      band: shelf_lt_500
      band_label: < 500 ft (shelf)
      scope: light_live_well
      scope_label: Light live-well (riserless wireline)
      scope_description: 'Riserless light well intervention: wireline/slickline through
        a subsea lubricator from an RLWI monohull or MPSV. Live well, no riser.'
      eligible_asset_classes:
      - rlwi_monohull
      - mpsv
      riser_required: false
      riser_rule: Depth does not pick the asset; riser-need picks the asset.
      modu_servicing_band: false
      availability_constrained: false
      horizontal_tree: false
      hxt_modifier_applied: false
      notes:
      - "Shelf band (< 500 ft): jack-up / platform serviceable \u2014 not a MODU-required\
        \ water depth."
    through_tubing_ct:
      band: shelf_lt_500
      band_label: < 500 ft (shelf)
      scope: through_tubing_ct
      scope_label: Through-tubing coiled tubing
      scope_description: "Through-tubing coiled-tubing work (stimulation, scale, perforating).\
        \ Needs an intervention riser \u2014 heavy-intervention semi or MODU."
      eligible_asset_classes:
      - heavy_intervention_semi
      - modu
      riser_required: true
      riser_rule: Depth does not pick the asset; riser-need picks the asset.
      modu_servicing_band: false
      availability_constrained: false
      horizontal_tree: false
      hxt_modifier_applied: false
      notes:
