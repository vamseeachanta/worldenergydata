bands:
  shelf_lt_500: < 500 ft (shelf)
  band_500_3000: 500-3,000 ft
  band_3000_5000: 3,000-5,000 ft
  band_5000_10000: 5,000-10,000 ft
  band_gt_10000: '> 10,000 ft'
asset_classes:
  rlwi_monohull: 'Riserless light well intervention monohull (vessel_fleet #592)'
  mpsv: 'Multipurpose support vessel (vessel_fleet #592)'
  heavy_intervention_semi: 'Heavy-intervention semi, e.g. Helix Q-class (vessel_fleet
    #592)'
  modu: Mobile offshore drilling unit (drillship / drilling semi)
rules:
  riser_rule: Depth does not pick the asset; riser-need picks the asset.
  hxt_modifier: A horizontal subsea tree (HXT) tubing pull forces a riser-based asset
    even for otherwise-light scope.
  availability_constraint: Light riserless work in 5,000-10,000 ft is availability_constrained
    (thin supply of rated units), not capability-limited.
provenance:
  band_scheme: worldenergydata#583 (well_inventory_by_band)
  asset_taxonomy: worldenergydata#592 (vessel_fleet.constants.VesselType)
  issue: 'worldenergydata#586 (epic #582)'
confidence: Capability/riser-need rules are [engineering judgement] from standard
  subsea-intervention practice (RLWI vs CT vs full workover), not a measured BSEE
  dataset. Band-level *availability* (unit supply) is indicative and should be calibrated
  against the vessel fleet (#592).
