    description: evidence table name or parent_reference
    unit: ''
  - name: sha256
    type: string
    description: record fingerprint (64 lowercase hex)
    unit: ''
  - name: decision
    type: string
    description: publication decision; only the first two permit export
    unit: ''
    enum:
    - eligible_factual_derivative
    - permission_granted
    - unresolved
    - prohibited
  - name: proposed_decision
    type: string
    description: always unresolved as generated
    unit: ''
  - name: basis
    type: string|null
    description: public basis for decision; null until reviewed; property is always present, null until
      reviewed
    unit: ''
    optional: false
  - name: reviewer
    type: string|null
    description: must be the repository maintainer for eligible decisions; property is always present, null
      until reviewed
    unit: ''
    optional: false
  - name: approval_ref
    type: string
    description: required for eligible decisions
    unit: ''
    optional: true
  - name: reviewed_sha256
    type: string
    description: must equal sha256 for eligible decisions
    unit: ''
    optional: true
  - name: permission_ref
    type: string
    description: required when decision is permission_granted
    unit: ''
    optional: true
  - name: authority_note
    type: string
    description: fixed signoff-is-evidence-not-authority note
    unit: ''
- name: catalog_match_decisions.json
  path: <output-dir>/catalog_match_decisions.json
  format: json
  description: 'Sole authority for equivalence adjudication: array of maintainer decisions bound to crosswalk
    candidates by (entity_id, legacy_row_fingerprint, relation_type) and candidate_sha256.'
  status: local_draft_public_export_requires_maintainer_eligibility
  contract_only: true
  columns:
  - name: entity_id
    type: string
    description: crosswalk key part
    unit: ''
  - name: legacy_row_fingerprint
    type: string
    description: crosswalk key part
    unit: ''
  - name: relation_type
    type: string
    description: crosswalk key part
    unit: ''
    enum: *id002
  - name: match_status
    type: string
    description: disposition
    unit: ''
    enum: *id003
  - name: candidate_sha256
    type: string
    description: must equal the candidate's digest
    unit: ''
  - name: approved_by
    type: string
    description: maintainer sign-off
    unit: ''
  - name: approval_ref
    type: string
    description: signoff evidence reference
    unit: ''
  - name: adjudication_source_refs
    type: list
    description: required to accept a conflicting candidate
    unit: ''
    optional: true
- name: integration_manifest.json
  path: <output-dir>/integration_manifest.json
  format: json
  description: Pins schema version, input/output/decision hashes, counts and readiness for the extension;
    never pins its own hash. Machine-readable JSON Schema is data/modules/offshore_assets/catalog_integration_schema.json.
    Raw-source hashes are unknown_not_retained.
  status: local_draft_public_export_requires_maintainer_eligibility
  contract_only: true
  columns:
  - name: dataset_id
    type: string
    description: fixed
    unit: ''
    enum:
    - angola-field-development-evidence
    presence:
      draft: present
      export: present
    optional: false
  - name: schema_version
    type: integer
    description: fixed 1
    unit: ''
    enum:
    - 1
    presence:
      draft: present
      export: present
    optional: false
  - name: state
    type: string
    description: publication state
    unit: ''
    enum:
    - local_draft_not_for_publication
    - eligible_derived_export
    presence:
      draft: present
      export: present
    optional: false
  - name: readiness
    type: string
    description: fixed
    unit: ''
    enum:
    - partial_research_only
    presence:
      draft: present
      export: present
    optional: false
  - name: input_hashes
    type: dict
    description: filename -> SHA-256 for the five evidence tables (.json), legacy_catalog, inherited_cost_parent,
      original_manifest
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
    value_schema:
      type: object
      additionalProperties:
        type: string
        pattern: ^[a-f0-9]{64}$
  - name: output_hashes
    type: dict
    description: artifact filename -> SHA-256 for every other emitted artifact
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
    value_schema:
      type: object
      additionalProperties:
        type: string
        pattern: ^[a-f0-9]{64}$
  - name: decision_sha256
    type: string
    description: fingerprint of match decisions
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
  - name: eligibility_sha256
    type: string
    description: fingerprint of eligibility matrix
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
  - name: gate_input_sha256
    type: dict
    description: optional raw gate-file byte digests (match_decisions, eligibility)
    unit: ''
    optional: true
    presence:
      draft: optional
      export: optional
    value_schema:
      type: object
      description: Optional raw CLI gate-file byte digests; separate from normalized semantic decision
        digests and not authentication.
      properties:
        match_decisions:
          type: string
          pattern: ^[a-f0-9]{64}$
        eligibility:
          type: string
          pattern: ^[a-f0-9]{64}$
      additionalProperties: false
  - name: counts
    type: dict
    description: evidence table -> record count
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
    value_schema:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
  - name: entity_counts
    type: dict
    description: entity_type -> count
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
    value_schema:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
  - name: research_entity_count
    type: integer
    description: non-supplemental registry entities
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
  - name: registry_entity_count
    type: integer
    description: all registry entities
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
  - name: supplemental_entity_count
    type: integer
    description: supplemental registry entities
    unit: ''
    presence:
      draft: present
      export: present
    optional: false
  - name: legacy_row_count
    type: integer
    description: legacy Angola rows (sum of multiplicities)
    unit: ''
    optional: false
    presence:
      draft: present
      export: present
  - name: source_counts
    type: dict
    description: pre-deferral counts per table incl. parent_reference
    unit: ''
    optional: true
    presence:
      draft: absent
      export: present
  - name: deferred_counts
    type: dict
    description: deferred records per table
    unit: ''
    optional: true
    presence:
      draft: absent
      export: present
  - name: as_of
    type: string|null
    description: Original snapshot as_of; property is always present in both modes, null when the snapshot
      omits the date
    unit: ''
    optional: false
    presence:
      draft: present
      export: present
  - name: raw_source_hashes
    type: string
    description: unknown_not_retained
    unit: ''
    optional: false
    presence:
      draft: present
      export: present
  - name: authority_note
    type: string
    description: signoff-is-evidence note
    unit: ''
    optional: false
    presence:
      draft: present
      export: present
  fingerprint:
    inputs:
      decision_sha256: complete ordered match_decisions array
      eligibility_sha256: complete ordered eligibility array
    algorithm: SHA-256
    encoding: UTF-8
    json_options: *id001
    native_values: null stays null; lists retain order; objects have sorted names; no CSV conversion
    recomputation:
      value: []
      sha256: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
binary_stores: []
