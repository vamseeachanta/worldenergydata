    type: string
    description: fingerprint of match decisions
    unit: ''
  - name: eligibility_sha256
    type: string
    description: fingerprint of eligibility matrix
    unit: ''
  - name: gate_input_sha256
    type: dict
    description: optional raw gate-file byte digests (match_decisions, eligibility)
