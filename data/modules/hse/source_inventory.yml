# HSE source inventory: every incident and safety data source we hold or should hold.
# One entry per source. Facts were checked on the date in `checked`; a value of
# "not confirmed" means the check could not be made, not that the answer is no.
#
# access:  public_bulk   machine-readable download, no login
#          public_docs   public PDF or HTML only
#          blocked       public, but the site refused non-browser clients on the check date
#          login         free registration required
#          paid          paywall, membership or internal-use-only terms
# held:    yes | partial | links_only | no
# refresh: monthly (in config/hse/monthly_sources.yml) | manual | none
# decision: owner (needs an account, payment or a terms decision) | none
# last_run: date of the last pull. 2026-11-12 is the trial run of the monthly runner into a
#          temporary folder; the held copy on external storage keeps the date in held_note.
schema_version: 1
checked: "2026-11-12"
