unavailable:
  value: null
  rationale: Evidence is absent or insufficient; null is distinct from zero.
permit_length_unit:
  value: ft
  rationale: The permit length is treated as feet; the point-derived route length remains independent.
empty_density:
  value: 0
  rationale: No internal contents mass is credited in the empty screening case.
product_density:
  value: null
  rationale: An unrecognised product code does not establish contents density.
product_densities:
  value:
    OIL: null
    BLKO: null
    GAS: null
    BLKG: null
    COND: null
    H2O: null
    LIFT: null
    G/C: null
  rationale: Product codes select cases, but composition and operating conditions do not establish
    numeric densities.
empty_case_governs:
  value: empty
  rationale: The empty case is assumed governing for minimum internal mass; the product case is retained
    separately.
grade:
  value: assumed_X52
  rationale: Assumed, based on previous experience represented by the existing pipeline safety workflow;
    no certificate is supplied.
  basis: pipeline_safety.workflow:_DEFAULT_SMYS_MPA
smys_pa:
  value: 358530000
  rationale: The existing workflow strength default is converted from MPa to Pa; it does not establish
    material certification.
  basis: pipeline_safety.workflow:_DEFAULT_SMYS_MPA
schedule:
  value: STD
  rationale: A local lookup preference only; the public build does not reuse an unqualified dimensional
    table.
nominal_od_proxy:
  value: nominal_size
  rationale: Inch-coded nominal size is an OD proxy when no qualified dimensional lookup is supplied.
corrosion_coating:
  value: null
  rationale: The public bulk records do not establish a corrosion coating system.
corrosion_coating_thickness_m:
  value: null
  rationale: No evidenced coating thickness is supplied; bare steel is not silently assumed.
concrete_density_kg_m3:
  value: null
  rationale: No evidenced concrete density is supplied; unknown concrete is not zero density.
seabed_current_m_s:
  value: 0.3
  rationale: Assumed, based on previous experience; the existing background current baseline does
    not establish seabed storm current.
  basis: metocean.extrapolation.__init__:_BASELINE
normal_wave_direction:
  value: normal_to_route
  rationale: Cross-route direction is assumed for screening; no measured storm direction is implied.
friction_coefficient:
  value: 0
  rationale: No sliding resistance is credited; this is an assumed lower bound rather than a measured
    coefficient.
soil_depth_boundary_m:
  value: 304.8
  rationale: The existing 1000-foot depth classification is converted to metres; it is not a geotechnical
    boundary.
  basis: bsee.data.models.pipeline:_DEEPWATER_DEPTH_THRESHOLD
soil_shallow:
  value: assumed sand
  rationale: Assumed, based on previous experience, only when public sediment evidence is unavailable;
    site geology is unqualified.
soil_deep:
  value: assumed clay
  rationale: Assumed, based on previous experience, only when public sediment evidence is unavailable;
    site geology is unqualified.
history_years:
  value:
  - 2022
  - 2023
  - 2024
  - 2025
  rationale: Four completed calendar archives allow a span beyond the EVA tool's three-year minimum;
    completeness remains unqualified.
status_meanings:
  value:
    A/C: ABANDONED AND COMBINED
    ABN: ABANDONED
    ACT: ACTIVE
    CNCL: CANCELLED
    COMB: COMBINED
    O/C: OUT AND COMBINED
    OUT: OUT OF SERVICE
    PABN: PROPOSE ABANDONMENT
    PREM: PROPOSE REMOVAL
    PROP: PROPOSED
    R/A: RELINQUISHED AND ABANDONED
    R/C: RELINQUISHED AND COMBINED
    R/R: RELINQUISHED AND REMOVED
    RELQ: RELINQUISHED
    REM: REMOVED
  rationale: Published meanings define the abandoned, removed and out exclusions. Codes absent from
    this dictionary remain unqualified and are excluded; selection alone does not establish installation
    or operation.
  basis: https://www.data.bsee.gov/Pipeline/PipelinePermits/FieldValues.aspx?domain=STATUS_CODES
  basis_sha256: 4b790c6d53a455fd8ddb403ca84d47de3a9e82bda0e145260144cdccdd0e081b
