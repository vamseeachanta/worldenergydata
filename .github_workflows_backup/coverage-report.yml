name: Coverage Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop, master]

jobs:
  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for accurate coverage
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install uv
        uv venv
        uv pip install -e ".[dev]"
        uv pip install pytest-cov coverage coverage-badge
    
    - name: Run tests with coverage
      run: |
        uv run pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-branch \
          --cov-fail-under=15 \
          -v
      continue-on-error: true
    
    - name: Generate coverage badge
      run: |
        coverage-badge -o coverage.svg -f
        coverage report --format=markdown > coverage_report.md
      continue-on-error: true
    
    - name: Coverage summary
      id: coverage-summary
      run: |
        coverage_percent=$(python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.attrib.get('line-rate', 0)) * 100
        print(f'{coverage:.1f}')
        ")
        
        echo "coverage=${coverage_percent}" >> $GITHUB_OUTPUT
        
        # Generate detailed report
        echo "## Coverage Report 📊" > coverage_summary.md
        echo "" >> coverage_summary.md
        echo "**Overall Coverage:** ${coverage_percent}%" >> coverage_summary.md
        echo "" >> coverage_summary.md
        
        # Add coverage by module
        echo "### Coverage by Module" >> coverage_summary.md
        echo "" >> coverage_summary.md
        uv run coverage report --format=markdown >> coverage_summary.md
        
        # Identify uncovered files
        echo "" >> coverage_summary.md
        echo "### Files with Low Coverage (<50%)" >> coverage_summary.md
        echo "" >> coverage_summary.md
        uv run coverage report --skip-covered --skip-empty | grep -E "^src.*[0-4][0-9]%" >> coverage_summary.md || true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = '${{ steps.coverage-summary.outputs.coverage }}';
          const coverageReport = fs.readFileSync('coverage_summary.md', 'utf8');
          
          // Determine emoji based on coverage
          let emoji = '🔴';
          if (parseFloat(coverage) >= 80) emoji = '🟢';
          else if (parseFloat(coverage) >= 60) emoji = '🟡';
          else if (parseFloat(coverage) >= 40) emoji = '🟠';
          
          const body = `## ${emoji} Code Coverage: ${coverage}%
          
          ${coverageReport}
          
          ---
          
          📈 **View Details:**
          - [Coverage Report](https://codecov.io/gh/${{ github.repository }})
          - [HTML Report Artifact](#) (download from workflow artifacts)
          
          *Coverage updated by GitHub Actions at ${new Date().toUTCString()}*
          `;
          
          // Find and update or create comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Code Coverage:')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
    
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ github.run_number }}
        path: |
          coverage.xml
          coverage.svg
          htmlcov/
          coverage_report.md
          coverage_summary.md
        retention-days: 30
    
    - name: Check coverage threshold
      run: |
        coverage_percent="${{ steps.coverage-summary.outputs.coverage }}"
        min_coverage=15
        
        if (( $(echo "$coverage_percent < $min_coverage" | bc -l) )); then
          echo "::error::Coverage ${coverage_percent}% is below minimum threshold of ${min_coverage}%"
          exit 1
        fi
        
        echo "✅ Coverage ${coverage_percent}% meets minimum threshold of ${min_coverage}%"