name: Test Suite

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - performance
          - smoke

env:
  PYTHON_VERSION: '3.9'
  CACHE_VERSION: 'v1'

jobs:
  test:
    name: Test Suite - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']
        exclude:
          # Exclude some combinations to save CI time
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for coverage reports
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-${{ env.CACHE_VERSION }}-
          ${{ runner.os }}-python-${{ matrix.python-version }}-
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      if: runner.os != 'Windows'
    
    - name: Install UV (Windows)
      run: |
        irm https://astral.sh/uv/install.ps1 | iex
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
      if: runner.os == 'Windows'
      shell: pwsh
    
    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"
        uv pip install pytest-cov pytest-benchmark pytest-timeout pytest-xdist
    
    - name: Run linting and formatting checks
      run: |
        uv run black --check src tests
        uv run isort --check-only src tests
        uv run ruff check src tests
      continue-on-error: true
    
    - name: Run type checking
      run: |
        uv run mypy src --ignore-missing-imports
      continue-on-error: true
    
    - name: Run tests with coverage
      id: test
      run: |
        if [ "${{ inputs.test_scope }}" = "smoke" ]; then
          uv run pytest tests/ -m "not slow" --cov=src --cov-report=xml --cov-report=term -v
        elif [ "${{ inputs.test_scope }}" = "unit" ]; then
          uv run pytest tests/unit/ --cov=src --cov-report=xml --cov-report=term -v
        elif [ "${{ inputs.test_scope }}" = "integration" ]; then
          uv run pytest tests/integration/ --cov=src --cov-report=xml --cov-report=term -v
        elif [ "${{ inputs.test_scope }}" = "performance" ]; then
          uv run pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark.json
        else
          uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term --cov-report=html -v
        fi
      shell: bash
      env:
        PYTEST_TIMEOUT: 300
    
    - name: Generate test report
      if: always()
      run: |
        uv run python -m worldenergydata.testing.performance.cli report --format json --output test-report.json
        uv run python -m worldenergydata.testing.performance.cli slowest --limit 10 > slowest-tests.txt
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
          .coverage
          test-report.json
          slowest-tests.txt
          benchmark.json
          .test_performance.db
        retention-days: 30
    
    - name: Check test performance regression
      if: github.event_name == 'pull_request'
      run: |
        uv run python -m worldenergydata.testing.performance.cli regressions --threshold 2.0 --days 7
      continue-on-error: true

  parallel-tests:
    name: Parallel Test Execution
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install uv
        uv venv
        uv pip install -e ".[dev]"
        uv pip install pytest-xdist pytest-cov
    
    - name: Run tests in parallel
      run: |
        uv run pytest tests/ -n auto --cov=src --cov-report=xml --dist loadscope
      env:
        PYTEST_TIMEOUT: 300
    
    - name: Upload parallel test results
      uses: actions/upload-artifact@v3
      with:
        name: parallel-test-results
        path: |
          coverage.xml
          .coverage

  test-report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [test, parallel-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install reporting tools
      run: |
        pip install pandas plotly coverage
    
    - name: Generate consolidated report
      run: |
        python -c "
        import json
        import glob
        from pathlib import Path
        
        # Collect all test reports
        reports = []
        for report_file in glob.glob('test-artifacts/*/test-report.json'):
            try:
                with open(report_file) as f:
                    reports.append(json.load(f))
            except:
                pass
        
        # Generate summary
        if reports:
            total_tests = sum(r.get('statistics', {}).get('total_executions', 0) for r in reports)
            avg_success = sum(r.get('statistics', {}).get('overall_success_rate', 0) for r in reports) / len(reports)
            
            print('## Test Execution Summary')
            print(f'- Total test executions: {total_tests}')
            print(f'- Average success rate: {avg_success:.1f}%')
            print(f'- Test reports analyzed: {len(reports)}')
        else:
            print('No test reports found')
        " > test-summary.md
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('## Test Execution Summary')
          );
          
          const body = `## 🧪 Test Results\n\n${summary}\n\n*Updated by GitHub Actions*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  deployment-gate:
    name: Deployment Quality Gate
    runs-on: ubuntu-latest
    needs: [test, parallel-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts
    
    - name: Check quality gates
      id: quality-check
      run: |
        # Check coverage threshold
        coverage_file=$(find test-artifacts -name "coverage.xml" | head -1)
        if [ -f "$coverage_file" ]; then
          coverage=$(python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('$coverage_file')
        root = tree.getroot()
        coverage = float(root.attrib.get('line-rate', 0)) * 100
        print(f'{coverage:.1f}')
        ")
          echo "Coverage: ${coverage}%"
          
          # Fail if coverage is below threshold
          if (( $(echo "$coverage < 20" | bc -l) )); then
            echo "::error::Coverage ${coverage}% is below minimum threshold of 20%"
            exit 1
          fi
        fi
        
        echo "✅ All quality gates passed"
    
    - name: Create deployment marker
      if: success()
      run: |
        echo "Deployment approved at $(date)" > deployment-approved.txt
        echo "Coverage: ${coverage}%" >> deployment-approved.txt
    
    - name: Upload deployment approval
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: deployment-approval
        path: deployment-approved.txt