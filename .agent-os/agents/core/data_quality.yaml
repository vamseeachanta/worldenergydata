agent:
  name: "data_quality"
  version: "1.0.0"
  specialization: "Data Quality and Validation"
  description: "Specialized agent for data validation, cleaning, quality assurance, and anomaly detection in energy datasets"
  
  knowledge_domains:
    - data_validation
    - data_cleaning
    - anomaly_detection
    - statistical_analysis
    - data_standardization
    - quality_metrics
    - outlier_detection
    - data_profiling
  
  learning_schedule:
    frequency: "weekly"
    day: "wednesday"
    time: "09:00"
    resources:
      - data_science_literature
      - quality_assurance_standards
      - statistical_methods_papers
      - industry_data_standards
      - machine_learning_resources
  
  capabilities:
    - data_validation
    - outlier_detection
    - data_cleaning
    - quality_assessment
    - statistical_analysis
    - data_profiling
    - standardization
    - completeness_analysis
    - consistency_checking
    - accuracy_validation
  
  performance_metrics:
    accuracy_target: 0.98
    response_time_target: 1.5
    knowledge_growth_rate: 0.08
  
  created_date: "2025-07-25"
  last_updated: "2025-07-25"