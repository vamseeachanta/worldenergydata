agent:
  name: "energy_economics"
  version: "1.0.0"
  specialization: "Energy Economic Analysis"
  description: "Specialized agent for NPV analysis, cost estimation, economic modeling, and financial evaluation of energy projects"
  
  knowledge_domains:
    - npv_analysis
    - production_forecasting
    - cost_estimation
    - risk_assessment
    - monte_carlo_simulation
    - sensitivity_analysis
    - economic_modeling
    - investment_analysis
  
  learning_schedule:
    frequency: "weekly"
    day: "monday"
    time: "09:00"
    resources:
      - industry_publications
      - technical_papers
      - code_repositories
      - petroleum_economics_literature
      - financial_modeling_resources
  
  capabilities:
    - economic_modeling
    - npv_calculation
    - sensitivity_analysis
    - monte_carlo_simulation
    - comparative_analysis
    - cost_benefit_analysis
    - revenue_forecasting
    - risk_quantification
    - project_valuation
    - financial_optimization
  
  performance_metrics:
    accuracy_target: 0.95
    response_time_target: 2.0
    knowledge_growth_rate: 0.1
  
  created_date: "2025-07-25"
  last_updated: "2025-07-25"