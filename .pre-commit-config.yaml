# Pre-commit hooks for World Energy Data
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=88]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503
          - --exclude=__pycache__,*.egg-info,.git,.venv,docs/_legacy
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-ll, -ii, -x, tests/]
        files: \.py$

  # Type checking (optional - can be slow)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --no-error-summary
        files: ^src/worldenergydata/common/
        pass_filenames: false
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041]
        exclude: ^docs/_legacy/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: relaxed, rules: {line-length: {max: 120}}}"

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Note: requires workspace-hub parent checkout; ../.gitleaks.toml is hub-relative
        args: [--config, ../.gitleaks.toml]

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Local repository structure guards
  - repo: local
    hooks:
      - id: no-windows-path-dirs
        name: No Windows-path directory artifacts
        language: python
        entry: python scripts/hooks/check-no-windows-paths.py
        pass_filenames: false
        stages: [pre-commit]
      - id: repo-structure-contract
        name: Repository structure contract
        language: python
        entry: python scripts/maintenance/verify_repo_structure.py
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - PyYAML
      - id: legal-sanity-scan
        name: Legal sanity scan (deny list)
        language: script
        entry: ../scripts/legal/legal-sanity-scan.sh
        args: [--repo=worldenergydata]
        pass_filenames: false
        stages: [pre-commit]

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip mypy in CI (covered by dedicated job)
