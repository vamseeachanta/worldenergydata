<svg viewBox="0 0 720 360" width="100%" role="img" aria-label="Indicative day-rate bands by class" xmlns="http://www.w3.org/2000/svg" style="max-width:760px;height:auto;font-family:Helvetica,Arial,sans-serif"><title>Indicative day-rate bands by class</title><desc>Indicative public day-rate bands: drillship $300-530k (median $457k), semisub $452-490k, mpsv $22-80k; intervention semis and RLWI monohulls have no public rate.</desc><rect x="0" y="0" width="720" height="360" fill="#ffffff"/><text x="20.0" y="18.0" font-size="12.5" fill="#0b3d5c" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Indicative day-rate bands by asset class ($k/day)</text><line x1="130.0" y1="46.0" x2="130.0" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="130.0" y="308.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">$0k</text><line x1="242.4" y1="46.0" x2="242.4" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="242.4" y="308.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">$150k</text><line x1="354.8" y1="46.0" x2="354.8" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="354.8" y="308.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">$300k</text><line x1="467.2" y1="46.0" x2="467.2" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="467.2" y="308.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">$450k</text><line x1="579.6" y1="46.0" x2="579.6" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="579.6" y="308.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">$600k</text><line x1="692.0" y1="46.0" x2="692.0" y2="294.0" stroke="#e3e9ee" stroke-width="1"/><text x="692.0" y="308.0" font-size="8.5" fill="#5b6b7b