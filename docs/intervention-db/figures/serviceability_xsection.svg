<svg viewBox="0 0 740 440" width="100%" role="img" aria-label="Depth-band serviceability cross-section" xmlns="http://www.w3.org/2000/svg" style="max-width:760px;height:auto;font-family:Helvetica,Arial,sans-serif"><title>Depth-band serviceability cross-section</title><desc>Water-column cross-section: subsea wells concentrate in the 5,000-10,000 ft band (270 wells) yet only ~3 dedicated intervention units are GoM-resident. RLWI monohull works riserless on a live well; MODU and Helix-class semi run a full workover riser on a dead well.</desc><rect x="0" y="0" width="740" height="440" fill="#ffffff"/><text x="20.0" y="22.0" font-size="13" fill="#0b3d5c" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Depth-band serviceability: who can reach each well</text><rect x="92.0" y="88.0" width="398.0" height="312.0" rx="0" fill="#cfe2ef" opacity="0.55"/><line x1="92.0" y1="88.0" x2="490.0" y2="88.0" stroke="#1c7ab0" stroke-width="2"/><text x="96.0" y="83.0" font-size="8.5" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">sea surface</text><line x1="86.0" y1="88.0" x2="490.0" y2="88.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="91.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">0 ft</text><line x1="86.0" y1="101.0" x2="490.0" y2="101.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="104.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">500 ft</text><line x1="86.0" y1="166.0" x2="490.0" y2="166.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="169.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3,000 ft</text><line x1="86.0" y1="218.0" x2="490.0" y2="218.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="221.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">5,000 ft</text><line x1="86.0" y1="348.0" x2="490.0" y2="348.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="351.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">10,000 ft</text><line x1="86.0" y1="400.0" x2="490.0" y2="400.0" stroke="#cdd7e0" stroke-width="1" stroke-dasharray="3 3"/><text x="82.0" y="403.5" font-size="8.5" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">12,000 ft</text><rect x="92.0" y="218.0" width="398.0" height="130.0" rx="0" fill="#c0392b" opacity="0.1"/><line x1="92.0" y1="218.0" x2="490.0" y2="218.0" stroke="#c0392b" stroke-width="1.2"/><line x1="92.0" y1="348.0" x2="490.0" y2="348.0" stroke="#c0392b" stroke-width="1.2"/><text x="502.0" y="92.5" font-size="9.5" fill="#15202b" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">&lt; 500 ft (shelf)</text><text x="502.0" y="105.5" font-size="8.5" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">0 subsea wells [on record]</text><text x="502.0" y="131.5" font-size="9.5" fill="#15202b" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">500-3,000 ft</text><text x="502.0" y="144.5" font-size="8.5" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">114 subsea wells [on record]</text><text x="502.0" y="190.0" font-size="9.5" fill="#15202b" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">3,000-5,000 ft</text><text x="502.0" y="203.0" font-size="8.5" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">209 subsea wells [on record]</text><text x="502.0" y="281.0" font-size="9.5" fill="#c0392b" text-anchor="start"