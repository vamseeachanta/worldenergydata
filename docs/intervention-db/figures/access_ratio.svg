<svg viewBox="0 0 720 380" width="100%" role="img" aria-label="Access-gap ratio: forward demand vs GoM-resident supply" xmlns="http://www.w3.org/2000/svg" style="max-width:760px;height:auto;font-family:Helvetica,Arial,sans-serif"><title>Access-gap ratio: forward demand vs GoM-resident supply</title><desc>Forward demand/supply ratio against the GoM-resident heavy fleet: 1.6x, 3.1x and 4.4x in the three populated deepwater bands (&gt;1.0x = access risk).</desc><rect x="0" y="0" width="720" height="380" fill="#ffffff"/><line x1="70.0" y1="316.0" x2="694.0" y2="316.0" stroke="#e3e9ee" stroke-width="1"/><text x="62.0" y="319.5" font-size="9" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">0x</text><line x1="70.0" y1="248.0" x2="694.0" y2="248.0" stroke="#e3e9ee" stroke-width="1"/><text x="62.0" y="251.5" font-size="9" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">1.25x</text><line x1="70.0" y1="180.0" x2="694.0" y2="180.0" stroke="#e3e9ee" stroke-width="1"/><text x="62.0" y="183.5" font-size="9" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">2.5x</text><line x1="70.0" y1="112.0" x2="694.0" y2="112.0" stroke="#e3e9ee" stroke-width="1"/><text x="62.0" y="115.5" font-size="9" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3.75x</text><line x1="70.0" y1="44.0" x2="694.0" y2="44.0" stroke="#e3e9ee" stroke-width="1"/><text x="62.0" y="47.5" font-size="9" fill="#5b6b7b" text-anchor="end" font-weight="normal" font-family="Helvetica,Arial,sans-serif">5x</text><line x1="70.0" y1="44.0" x2="70.0" y2="316.0" stroke="#cdd7e0" stroke-width="1.2"/><line x1="70.0" y1="316.0" x2="694.0" y2="316.0" stroke="#cdd7e0" stroke-width="1.2"/><text x="18.0" y="180.0" font-size="10" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif" transform="rotate(-90 18.0 180.0)">Demand / resident-supply (x)</text><text x="132.4" y="312.0" font-size="9" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">0</text><text x="132.4" y="332.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">&lt; 500 ft (shelf)</text><rect x="217.0" y="229.0" width="80.4" height="87.0" rx="2" fill="#c0392b" opacity="1.0"/><text x="257.2" y="225.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">1.6x</text><text x="257.2" y="332.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">500-3,000 ft</text><rect x="341.8" y="147.4" width="80.4" height="168.6" rx="2" fill="#c0392b" opacity="1.0"/><text x="382.0" y="143.4" font-size="9" fill="#15202b" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">3.1x</text><text x="382.0" y="332.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3,000-5,000 ft</text><rect x="466.6" y="76.6" width="80.4" height="239.4" rx="2" fill="#c0392b" opacity="1.0"/><text x="506.8" y="72.6" font-size="9" fill="#15202b" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">4.4x</text><text x="506.8" y="332.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">5,000-10,000 ft</text><text x="631.6" y="312.0" font-size="9" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">0</text><text x="631.6" y="332.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">&gt; 10,000 ft</text><line x1="70.0" y1="261.6" x2="694.0" y2="261.6" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/><text x="692.0" y="257.6" font-size="9" fill="#c0