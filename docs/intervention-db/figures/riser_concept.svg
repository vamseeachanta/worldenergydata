<svg viewBox="0 0 740 388" width="100%" role="img" aria-label="Riser vs riserless intervention concept" xmlns="http://www.w3.org/2000/svg" style="max-width:760px;height:auto;font-family:Helvetica,Arial,sans-serif"><title>Riser vs riserless intervention concept</title><desc>Side-by-side concept: a light riserless intervention runs wireline through a subsea lubricator on a live well from a monohull (no riser); a heavy intervention runs a full workover riser and subsea BOP on a dead well from a MODU or Helix-class semi.</desc><rect x="0" y="0" width="740" height="388" fill="#ffffff"/><text x="20.0" y="24.0" font-size="13" fill="#0b3d5c" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Riser vs riserless intervention concept</text><rect x="20.0" y="96.0" width="340.0" height="212.0" rx="0" fill="#cfe2ef" opacity="0.5"/><line x1="20.0" y1="96.0" x2="360.0" y2="96.0" stroke="#1c7ab0" stroke-width="2"/><rect x="20.0" y="308.0" width="340.0" height="34.0" rx="0" fill="#caa874" opacity="0.7"/><text x="26.0" y="90.0" font-size="8" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">sea surface</text><text x="190.0" y="46.0" font-size="11" fill="#d98a0b" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">LIGHT — riserless</text><path d="M 148.0 82.0 L 232.0 82.0 L 219.4 94.0 L 160.6 94.0 Z" fill="#23323f"/><path d="M 183.0 82.0 L 190.0 64.0 L 197.0 82.0" fill="none" stroke="#23323f" stroke-width="2"/><text x="190.0" y="59.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">monohull (RLWI)</text><line x1="190.0" y1="96.0" x2="190.0" y2="280.0" stroke="#d98a0b" stroke-width="1.8" stroke-dasharray="2 3"/><text x="198.0" y="202.0" font-size="8.5" fill="#d98a0b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">wireline</text><rect x="183.0" y="268.0" width="14.0" height="16.0" rx="2" fill="#d98a0b" opacity="1.0"/><text x="202.0" y="276.0" font-size="8" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">subsea lubricator</text><rect x="181.0" y="296.0" width="18.0" height="12.0" rx="2" fill="#0b3d5c" opacity="1.0"/><rect x="186.0" y="290.0" width="8.0" height="6.0" rx="1" fill="#0b3d5c" opacity="1.0"/><text x="190.0" y="322.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">subsea tree</text><text x="32.0" y="358.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• live well (pressure contained)</text><text x="32.0" y="371.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• no riser, no subsea BOP</text><text x="32.0" y="384.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• wireline through lubricator</text><text x="32.0" y="397.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• light scopes only</text><rect x="380.0" y="96.0" width="340.0" height="212.0" rx="0" fill="#cfe2ef" opacity="0.5"/><line x1="380.0" y1="96.0" x2="720.0" y2="96.0" stroke="#1c7ab0" stroke-width="2"/><rect x="380.0" y="308.0" width="340.0" height="34.0" rx="0" fill="#caa874" opacity="0.7"/><text x="386.0" y="90.0" font-size="8" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">sea surface</text><text x="550.0" y="46.0" font-size="11" fill="#0b3d5c" text-anchor="start" font-weight="bold" font-family="Helvetica,Arial,sans-serif">HEAVY — full workover riser</text><path d="M 502.0 82.0 L 598.0 82.0 L 583.6 94.0 L 516.4 94.0 Z" fill="#23323f"/><path d="M 543.0 82.0 L 550.0 64.0 L 557.0 82.0" fill="none" stroke="#23323f" stroke-width="2"/><text x="550.0" y="59.0" font-size="9" fill="#15202b" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">MODU / Helix semi</text><line x1="550.0" y1="96.0" x2="550.0" y2="290.0" stroke="#0b3d5c" stroke-width="6"/><text x="562.0" y="202.0" font-size="8.5" fill="#0b3d5c" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">workover riser</text><rect x="541.0" y="282.0" width="18.0" height="16.0" rx="2" fill="#15202b" opacity="1.0"/><text x="564.0" y="290.0" font-size="8" fill="#5b6b7b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">subsea BOP</text><rect x="541.0" y="296.0" width="18.0" height="12.0" rx="2" fill="#0b3d5c" opacity="1.0"/><rect x="546.0" y="290.0" width="8.0" height="6.0" rx="1" fill="#0b3d5c" opacity="1.0"/><text x="550.0" y="322.0" font-size="8.5" fill="#5b6b7b" text-anchor="middle" font-weight="normal" font-family="Helvetica,Arial,sans-serif">subsea tree</text><text x="392.0" y="358.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• dead well (killed / isolated)</text><text x="392.0" y="371.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• full workover riser + subsea BOP</text><text x="392.0" y="384.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• tubing pull / recompletion / P&amp;A</text><text x="392.0" y="397.0" font-size="8.6" fill="#15202b" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">• heavy scopes</text><line x1="370.0" y1="56.0" x2="370.0" y2="344.0" stroke="#cdd7e0" stroke-width="1"/></svg>