  jobs_module: src/worldenergydata/scheduler/jobs/
  defined_jobs:
    - bsee_refresh
    - sodir_refresh
    - eia_us_refresh
    - metocean_refresh
    - brazil_anp_refresh
    - ukcs_refresh
    - lng_terminals_refresh
  jobs_with_data_dir_landed:
    - bsee_refresh
    - lng_terminals_refresh
  jobs_with_no_landing_dir:
    - sodir_refresh (output_dir data/modules/sodir not present)
    - eia_us_refresh (output_dir data/modules/eia not present)
    - metocean_refresh (output_dir data/modules/metocean not present)
    - brazil_anp_refresh (output_dir data/modules/brazil_anp not present)
