safe_refresh_commands:
  no_op_audit:
    - uv run python scripts/generate_data_catalog.py
    - uv run python scripts/generate_data_catalog.py --report
    - uv run python -m worldenergydata.scheduler.cli status
    - uv run python -m worldenergydata.scheduler.staleness
    - uv run python -m worldenergydata.scheduler.monitor
  endpoint_probe:
    - curl -sI https://www.data.bsee.gov/Well/Files/eWellWARRawData.zip
    - curl -sI https://www.data.bsee.gov/Well/Files/APDRawData.zip
    - curl -sI https://www.data.bsee.gov/Production/Files/ProductionRawData.zip
    - curl -sI https://www.data.bsee.gov/Other/Files/IncInvRawData.zip
    - curl -sI https://factmaps.sodir.no/api/rest/5000
    - curl -sI https://api.tidesandcurrents.noaa.gov/api/prod/datums?station=8771013&format=json
    - curl -sI https://www.ndbc.noaa.gov/data/realtime2/42040.txt
    - curl -sI https://giignl.org/wp-content/uploads/...
  bounded_sample:
    - uv run python -m worldenergydata.metocean ndbc --station 42040 --hours 24
    - uv run python -m worldenergydata.lng_terminals refresh --source giignl
    - uv run python -m worldenergydata.scheduler.jobs.sodir_refresh --max-records 100
    - uv run python -m worldenergydata.oil_price refresh
    - uv run python -m worldenergydata.wind refresh
  full_refresh_candidate_not_run:
    - uv run python -m worldenergydata.scheduler.jobs.bsee_refresh --binary
    - uv run python -m worldenergydata.scheduler.jobs.brazil_anp_refresh
    - uv run python -m worldenergydata.scheduler.jobs.lng_terminals_refresh
  blocked_credentials_or_api_required:
    - uv run python -m worldenergydata.scheduler.jobs.eia_us_refresh
    - uv run python -m worldenergydata.scheduler.jobs.ukcs_refresh
    - uv run python -m worldenergydata.canada.refresh  # Petrinex registration
    - uv run python -m worldenergydata.marine_safety.scrapers.imo_gisis  # IMO GISIS login
    - uv run python -m worldenergydata.metocean cmems  # Copernicus credentials
  blocked_implementation_needed:
    - uv run python -m worldenergydata.mexico_cnh.refresh  # JS-rendered SIH
    - uv run python -m worldenergydata.texas_rrc.refresh  # rate-limit-safe path
    - uv run python -m worldenergydata.marine_safety.importers.misle_importer  # MISLE portal redesign
    - uv run python -m worldenergydata.landman.refresh  # no scheduler job

follow_up_issue_candidates:
  - id: catalog-drift
    summary: data/catalog.yaml missing 15 of 27 declared modules; generator does not enumerate all data/modules/*
    related_issues: [336, 344]
  - id: scheduler-output-dir-mismatch
    summary: 5 scheduler jobs declare output_dir paths that do not exist on disk; eia_us output_dir name mismatch (data/modules/eia vs eia_us)
    related_issues: [266, 273]
  - id: bsee-current-stub-rot
    summary: 12 bsee/current/*.csv files are 100-row 2025-07-31 stubs; downstream fdas + dashboards consume stub data silently
    related_issues: [334]
  - id: marine-safety-scrape-failure-backlog
    summary: 4 zero-byte HTML files + 22 IMO GISIS placeholder pages; USCG MISLE / PHMSA / OSHA fatalities / IMO GISIS all blocked
    related_issues: [343]
  - id: eia-api-key-not-provisioned
    summary: scheduler_config eia_us_refresh has api_key=null; no .env reference loaded
    related_issues: [128, 151]
  - id: marine-safety-db-stale
    summary: both marine_safety SQLite DBs >180 days old; no automated refresh
    related_issues: [153]
  - id: source-registry-coverage-gap
    summary: landman, mexico_cnh, canada, texas_rrc declared in registry but no scheduler job
    related_issues: [124]
  - id: module-index-drift
    summary: MODULE_INDEX.md (2026-02-20) omits 15 src packages; includes modules without data dirs; needs regeneration from module-manifest.yaml
    related_issues: [344]
  - id: empty-placeholder-dirs
    summary: data/bsee/, data/marine_safety/, data/processed/, data/results/ all 0 bytes; document or remove
    related_issues: [344]
  - id: scheduler-alerting-not-configured
    summary: webhook_url + SMTP all null in scheduler_config; failures only land in logs/scheduler/status.json
    related_issues: [266, 273]

