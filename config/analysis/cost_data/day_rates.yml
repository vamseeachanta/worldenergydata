# ABOUTME: WRK-171 day-rate database for drilling, completion, and intervention.
# ABOUTME: Proxy rates derived from public industry benchmarks; updated annually.
# Units: USD per day
# Confidence: medium (proxy) unless noted
# Base: market-cycle averaged rates; use RegionalCostLoader for year interpolation.

metadata:
  version: "1.0.0"
  created_date: "2026-02-24"
  base_year: 2022
  description: |
    Proxy day rates for cost estimation by region, water depth band, and activity type.
    Sources: Baker Hughes rig activity reports, Transocean/Valaris/Seadrill earnings,
    BOEM GOM cost studies, SPE/OTC conference benchmarks.
  hpht_premium_factor: 1.30   # 30% premium applied when hpht=true
  notes: |
    - Rates exclude mobilisation / demobilisation
    - Year-indexed from 2020 to 2025 to capture market cycles
    - Region "permian" and "eagle_ford" represent onshore basins

