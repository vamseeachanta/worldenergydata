# Notes from FDAS V30 documentation
notes: |
  Lease mappings verified from FDAS V30 leases.xlsx
  
  Key observations:
  - Jack/St. Malo spans 6 leases (1 Jack, 5 St. Malo)
  - Anchor has 2 leases (G31751, G31752)
  - Cascade/Chinook combines 2 separate fields
  - Kaskida uses lowercase 'g' prefix
  - Shenandoah has 2 leases
  
  Water depths:
  - Deepest: Stones (9,525 ft)
  - Shallowest producing: Tiber (4,130 ft)
  
  Development systems:
  - subsea15: Older HPHT (15K psi) - Jack/St. Malo, Stones, Cascade/Chinook
  - tieback15: Tieback to existing host - Julia
  - subsea20: Next-gen HPHT (20K psi) - Anchor, Tiber, Kaskida, Shenandoah
  - dry: Dry tree system - Big Foot
