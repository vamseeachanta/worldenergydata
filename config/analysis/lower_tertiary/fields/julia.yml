# ABOUTME: Field-level configuration for Julia subsea tieback project
# ABOUTME: Supplies modular inputs for Julia economic analysis scenarios

field:
  field_id: julia
  display_name: "Julia"
  status: producing
  leases_key: julia
  # first_oil reconciled to BSEE OGOR-A first production (well 608124003301,
  # 2016-03), matching golden_baseline_v30.yml and the field economics report.
  # Was "2019-05-01" (unsourced; inconsistent with the OGOR-derived 2016 date
  # used by reports/lower_tertiary/field_economics_julia.md).
  first_oil: "2016-03-01"
  data_through: "2024-12-31"
  # P6: ExxonMobil starts production at Julia Oil Field in the Gulf of Mexico, 2016-04-19.
  # https://corporate.exxonmobil.com/news/news-releases/2016/0419_exxonmobil-starts-production-at-julia-oil-field-in-the-gulf-of-mexico
  # Checked 2026-10-11; issue 747.
  # "ExxonMobil, the operator, and Statoil Gulf of Mexico LLC each hold a 50 percent interest in the Julia unit."
  # Was "Equinor".
  operator: "ExxonMobil"
  partners:
    - name: "Equinor"
      working_interest: 0.50
    - name: "ExxonMobil"
      working_interest: 0.50
  capex:
    total_mm_usd: 4700
    host_mm_usd: 2500
    subsea_mm_usd: 1500
    wells_mm_usd: 700
  production_profile:
    plateau_rate_mbopd: 34
    gor_scf_per_bbl: 1000
  opex_per_boe: 18.0
