# Field Groups for Aggregate Analysis
field_groups:
  producing:
    name: "Currently Producing Lower Tertiary Fields"
    fields:
      - jack_st_malo
      - stones
      - julia
      - anchor
      - cascade_chinook
    
  pre_fid:
    name: "Discoveries Awaiting Final Investment Decision"
    fields:
      - tiber
      - kaskida
    
  under_development:
    name: "Fields Under Development (Pre-First Oil)"
    fields:
      - shenandoah
  
  by_operator:
    chevron:
      - jack_st_malo
      - anchor
    shell:
      - stones
    equinor:
      - julia
      - jack_st_malo  # Partner
      - anchor  # Partner
      - cascade_chinook  # Partner
    bp:
      - tiber
      - kaskida
    beacon:
      - shenandoah
    total:
      - cascade_chinook
  
  by_water_depth:
    deep_5000_7000ft:
      - jack_st_malo
      - anchor
      - shenandoah
    ultra_deep_7000plus_ft:
      - stones
      - cascade_chinook
      - kaskida

# Data Quality Notes
data_quality:
  production_data:
    source: "BSEE monthly production reports"
    availability: "Through December 2024"
    completeness:
      jack_st_malo: "Complete 2014-2024"
      stones: "Complete 2016-2024"
      julia: "Complete 2019-2024"
      anchor: "Partial 2024 (startup Aug 2024)"
      cascade_chinook: "Complete 2021-2024"
      shenandoah: "Not yet producing"
      tiber: "No production data"
      kaskida: "No production data"
  
  cost_data:
    source: "Public disclosures, SEC filings, operator presentations"
    reliability: "High for producing fields, estimates for pre-FID"
    notes: |
      Capital costs are as-disclosed by operators at FID or in
      subsequent project updates. Actual costs may vary from initial
      estimates, particularly for complex HPHT developments.
  
  reserves:
    source: "Operator estimates, not independently verified"
    classification: "Gross field estimates (before royalties/working interest)"
    notes: |
      Reserve estimates are operator estimates at FID or discovery.
      Actual recoverable reserves may differ based on production
      performance and future development decisions.

# Analysis Recommendations
recommendations:
  aggregations:
    - "Analyze producing fields with actual data"
    - "Separate pre-FID fields due to high uncertainty"
    - "Group by development concept (FPSO vs. tieback)"
    - "Compare operator performance"
  
  sensitivities:
    focus_on:
      - "Oil price impact (±20% most relevant)"
      - "Production decline rates"
      - "Operating cost inflation"
  
  comparisons:
    - "Early movers (Jack/St. Malo, Stones) vs. recent (Anchor)"
    - "Standalone facilities vs. tiebacks"
    - "Partner structure impact on decision-making"

