# Landman routing configuration for issue #924.
# Runtime coverage is intentionally fixture-only; live sources are reserved work.

module: landman
version: 1.0.0
implementation_status: alpha
execution_mode: fixture-only

router:
  route_modes:
    - auto
  atomic_operations:
    - ownership
    - leases
    - title
    - deeds
    - mortgages
    - assignments
  all_order:
    - ownership
    - leases
    - title
    - deeds
    - mortgages
    - assignments
  fail_atomic_preflight: true

fixture_source:
  requirement: exactly_one
  packaged_sample: county_records_v1.json
  custom_file_policy: cwd_direct_child_json
  max_bytes: 1048576
  max_records: 1000

providers:
  county_records:
    implementation_status: implemented
    router_operations: [ownership]
    mode: fixture-only
  county_reference:
    implementation_status: reference-only
    router_operations: []
    mode: embedded-reference
  blm:
    implementation_status: configured-only
    router_operations: []
    mode: live-reserved
  state_gis:
    implementation_status: configured-only
    router_operations: []
    mode: live-reserved
  drillinginfo:
    implementation_status: unavailable
    router_operations: []
    mode: subscription
  txdir:
    implementation_status: unavailable
    router_operations: []
    mode: subscription
  ogorgs:
    implementation_status: unavailable
    router_operations: []
    mode: unimplemented

output:
  formats: [table, json, csv]
  json_envelopes: true
  provider_provenance: true

non_goals:
  - live_blm_acquisition
  - live_county_portals
  - live_state_gis
  - federal_acreage_output
  - legal_or_title_conclusions
