# CANONICAL field-identity registry — the single source of truth for this repo.
# Do NOT add parallel field-name mappings anywhere else; extend THIS file (and the
# per-field `aliases:` list) instead. Every field id <-> display name <-> BSEE
# lease/area-block <-> FDP slug resolution derives from here. All other mapping
# configs in the repo are superseded for identity resolution by config/fields.yml.
# Loader + resolution API: worldenergydata.common.fields_registry (epic #754, issue #755).
#
# GROUP GOAL: establish worldenergydata as the home of THE canonical field-identity
# source for this analysis ecosystem.
#
# Schema (per field under `fields:`):
#   canonical_id   snake id == lifecycle _facts.json id (never changes)
#   display_name   human label
#   aliases        every external name that must resolve to this field (benchmark CSV
#                  free-text, V30/V50 baseline display names, WO-article name, roster name).
#                  resolve() is case/punctuation-insensitive, so exact display_name need
#                  not be repeated here.
#   region / play  descriptive
#   bsee:
#     area_blocks  structured BSEE area+block codes, canonicalized to ^[A-Z]{2}\d{3}$
#     leases       BSEE OCS lease numbers, canonicalized to ^G\d{5}$ (uppercased; the
#                  "OCS-G " prefix and internal spaces stripped at authoring time; the
#                  loader's by_lease() applies the SAME normalization to inputs so
#                  "OCS-G 25806", "g25806", "G 25806" and "G25806" all resolve).
#   bsee_block_note  original free-text block string (provenance; NOT machine-parsed).
#   fdp_slug       hyphenated FDP portfolio slug (unique; explicit override where the
#                  portfolio page name diverges from the display-name slug rule).
#   tier           optional; `kc_recovered` distinguishes KC-ingest-recovered fields
#                  (e.g. Buckskin) from the 10 rich Lower-Tertiary fields. kc_recovered
#                  entries are exempt from the fields_registry.yml cross-config coherence
#                  check (they are not in that auto-generated economics registry).
#   surfaces       has_* flags: what per-field pages are actually built today (not a roadmap).
#
# Structured `bsee.area_blocks`/`bsee.leases` are sourced from
# config/ong_field_development/fields_registry.yml (auto-generated) and, for Buckskin,
# from packages/worldenergydata-bsee/.../buckskin/buckskin_config.py. fields.yml stays
# hand-curated + contract-tested; a coherence test guards drift from that registry.
#
# FDP portfolio pages that map to NO canonical lifecycle field (Miocene/other-play
# tiebacks) are listed under `unmapped_fdp_pages` so the crosswalk stays honest.

fields:
